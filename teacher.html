var KEY_NAME='7942_tkey';

var APP_VER='2.7.0', NEED_SHELL=1;

function keyFrom(s){ s=String(s||'').trim(); var m=s.match(/\/s\/([A-Za-z0-9_-]{20,})\/(exec|dev)/); if(m) return m[1]; return /^[A-Za-z0-9_-]{20,}$/.test(s)?s:''; }
function lsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }

function apiKey(){ var k=keyFrom(Q.get('k')); if(k){ lsSet(KEY_NAME,k); return k; } return keyFrom(lsGet(KEY_NAME)); }
(function(){ var k=keyFrom(Q.get('k')); if(k){ lsSet(KEY_NAME,k); try{ history.replaceState(null,'',location.pathname+(DEMO_MODE?'?demo':'')); }catch(e){} Q.delete('k'); } })();

function rawCall(url,fn,args){

    .then(function(r){ return r.text(); },function(){ throw new Error('인터넷 연결이나 시트 주소를 확인해 주세요.'); })

      if(!j.ok) throw new Error(j.error); return j.data; });
}

  var u=apiUrl(); if(!u) return Promise.reject(new Error('연결된 시트가 없어요.'));

/* ───────── 미리보기용 가상 서버(지어낸 이름) ───────── */

          ['서지안','여'],['권우진','남'],['황채원','여'],['송태윤','남'],['안유나','여'],['류승현','남'],['전서윤','여'],['홍은호','남'],['문아인','여'],['배주원','남']];
  var roster=nm.map(function(n,i){ return {id:'S'+(i+1),no:i+1,name:n[0],gender:n[1],code:String(2000+Math.floor(rnd()*7000)),status:'재학'}; });
  var base={title:'우리반 친구들은?!',intro:'우리 반 친구들과 함께 지내면서 느낀 점을 솔직하게 써 보세요. 여러분이 쓴 내용은 선생님만 볼 수 있어요.',

    requireAllRelations:true,praiseMode:'gender',praiseMale:1,praiseFemale:1,praiseAny:2,praiseRequired:true,
    praiseQuestion:'이 친구가 친구 관계에서 칭찬받을 점은 무엇인가요? 이 친구와 친해지고 싶은 이유는?',conflictMax:2,

  var rounds=[{id:'R1',name:'1회차(5월)',created:'2026-05-27',status:'마감',settings:base},{id:'R2',name:'2회차(10월)',created:'2026-10-20',status:'진행중',settings:base}];
  var ans=[['편하고 재미있는 반','장난을 잘 치는 아이','체육 시간이 즐거웠다','모둠 활동 때 의견이 안 맞았다','서로 배려했으면 좋겠다'],
           ['가끔 시끄럽지만 좋은 반','조용한 편인 아이','친구가 많이 생겼다','쉬는 시간에 혼자 있을 때가 있었다','다 같이 노는 시간이 많았으면']];
  function gen(rid,drift){
    var out=[];

      roster.forEach(function(b,bi){ if(a===b) return;
        var same=a.gender===b.gender, near=Math.abs(ai-bi)<5;
        var p=rnd(), po=same?0.55:0.25; if(near) po+=0.15; if(bi===8) po-=0.4; if(ai===3||ai===11) po-=0.25;
        po+=drift*(bi===8?0.35:0.05);
        var px=0.06+(bi===8?0.25-drift*0.2:0)+((ai===3&&bi===11)||(ai===11&&bi===3)?0.9:0);
        rel[b.id]= p<po?'o':(p>1-px?'x':'t');
      });
      var os=roster.filter(function(b){return rel[b.id]==='o';});
      var praise=[], m=os.filter(function(b){return b.gender==='남';})[0], f=os.filter(function(b){return b.gender==='여';})[0];
      if(m) praise.push({id:m.id,name:m.name,slot:'남1',reason:'친절하게 도와줘서'}); if(f) praise.push({id:f.id,name:f.name,slot:'여1',reason:'같이 놀면 재미있어서'});
      var xs=roster.filter(function(b){return rel[b.id]==='x';}).slice(0,1).map(function(b){return {id:b.id,name:b.name,reason:'말을 함부로 할 때가 있어서'};});
      out.push({rid:rid,sid:a.id,no:a.no,name:a.name,time:rid==='R1'?'2026-05-27 10:1'+(ai%10):'2026-10-20 09:5'+(ai%10),answers:ans[ai%2],rel:rel,praise:praise,conflict:xs,message:ai%3?'':'선생님 항상 고맙습니다'});
    });
    return out;
  }
  var resp={R1:gen('R1',0),R2:gen('R2',1)};
  // 성격 강점 조사(지어낸 답)
  var strSet=JSON.parse(JSON.stringify(base)); strSet.kind='strength'; strSet.strTitle='나의 강점 찾기'; strSet.showCard=true;
  rounds.push({id:'R3',name:'성격 강점(11월)',created:'2026-11-05',status:'마감',settings:strSet});
  var MES=['그림을 잘 그려요','친구를 잘 웃겨요','달리기가 빨라요','책을 많이 읽어요','동생을 잘 돌봐요','정리를 잘해요','포기하지 않아요','노래를 잘 불러요'];
  resp.R3=roster.map(function(a,ai){ if(ai===20) return null;
    var b={E:2.6+rnd()*2,A:2.8+rnd()*1.9,C:2.5+rnd()*2.2,S:2.4+rnd()*2.2,O:2.7+rnd()*2};
    if(ai===8){ b.E=1.9; b.A=4.6; } if(ai===3||ai===11){ b.S=2.0; b.A=2.6; } if(ai===5){ b.E=4.7; }
    var sv=STR.items.map(function(it){ var v=Math.round(b[it.t]+(rnd()-0.5)*1.4); v=Math.max(1,Math.min(5,v)); return it.r?6-v:v; });
    var r1=STR.roles[Math.floor(rnd()*STR.roles.length)], r2=STR.roles[Math.floor(rnd()*STR.roles.length)], roles=r1===r2?[r1]:[r1,r2];
    return {rid:'R3',sid:a.id,no:a.no,name:a.name,time:'2026-11-05 10:0'+(ai%10),answers:STR.pack(sv,roles,MES[ai%MES.length]),rel:{},praise:[],conflict:[],message:''};
  }).filter(Boolean);
  if(Q.has('five')){ rounds[1].settings=JSON.parse(JSON.stringify(base)); rounds[1].settings.relScale=5;
    resp.R2.forEach(function(r){ Object.keys(r.rel).forEach(function(k){ var v=r.rel[k]; r.rel[k]=v==='o'?(rnd()<.5?'5':'4'):v==='t'?'3':(rnd()<.5?'2':'1'); }); }); }
  return {
    teacherLogin:function(){ return 'demo'; },
    teacherInit:function(){ return {roster:roster,rounds:rounds,url:'(배포한 웹앱 주소)',sheetUrl:'#',defaultPw:true}; },
    getRoundData:function(t,rid){ return {rid:rid,responses:resp[rid]||[]}; },
    createRound:function(t,name){ rounds.forEach(function(r){ if(r.status==='진행중') r.status='마감'; }); var id='R'+(rounds.length+1); rounds.push({id:id,name:name,created:'2026-11-09',status:'진행중',settings:JSON.parse(JSON.stringify(rounds[rounds.length-1].settings))}); resp[id]=[]; return rounds; },
    updateRound:function(t,rid,p){ rounds.forEach(function(r){ if(r.id===rid){ if(p.name!=null) r.name=p.name; if(p.status) r.status=p.status; if(p.settings) r.settings=p.settings; } else if(p.status==='진행중'&&r.status==='진행중') r.status='마감'; }); return rounds; },
    deleteRound:function(t,rid){ rounds=rounds.filter(function(r){return r.id!==rid;}); return rounds; },
    resetResponse:function(t,rid,sid){ resp[rid]=resp[rid].filter(function(r){return r.sid!==sid;}); return resp[rid]; },
    saveRoster:function(t,rows){ var old={}; roster.forEach(function(s){old[s.id]=s;}); roster=rows.filter(function(r){return r.name;}).map(function(r,i){ var o=old[r.id]; return {id:o?o.id:'N'+Date.now()+i,no:+r.no,name:r.name,gender:r.gender,code:o?o.code:String(1000+Math.floor(Math.random()*9000)),status:r.status||'재학'}; }); return roster; },
    regenCodes:function(t,ids){ roster.forEach(function(s){ if(!ids||ids.indexOf(s.id)>=0) s.code=String(1000+Math.floor(Math.random()*9000)); }); return roster; },
    exportMatrix:function(){ return '#'; },
    changePassword:function(){ return true; }
  };
})();

/* ───────── 상태 ───────── */
var T={ token:null, roster:[], rounds:[], rid:null, data:{}, tab:'status', url:'', sheetUrl:'', sel:null, cmpA:null, cmpB:null, sortKey:'no', sortDir:1 };
var root=document.getElementById('root');

function connectView(msg){
  root.innerHTML='<main style="max-width:560px;margin-top:60px"><div class="card"><div class="center"><div class="brand" role="img" aria-label="7942"><span>7</span><span>9</span><span>4</span><span>2</span></div><div class="brand-sub">친구사이 · 선생님</div></div>'+
   '<h2 style="margin-top:18px">내 시트 연결하기</h2><div class="sub">껍데기 시트를 웹 앱으로 배포하고 나온 주소(https://script.google.com/macros/s/.../exec)를 붙여 넣으세요. 이 기기에 기억되어 다음부터는 바로 열려요.</div>'+
   '<input id="wurl" placeholder="https://script.google.com/macros/s/..../exec" style="width:100%;margin:10px 0;padding:10px">'+
   '<button class="btn main" id="cn" style="width:100%;padding:10px">연결하기</button><div class="err" style="margin-top:8px">'+esc(msg||'')+'</div>'+
   '<div class="card" style="background:#f7f6f2;margin:14px 0 0"><b>아직 껍데기 시트가 없다면</b><ol class="sub" style="margin:6px 0 0;padding-left:18px"><li><a href="https://docs.google.com/spreadsheets/d/1x-yX5q_4KDUINBTxxXw7Oc7cbsWddgakaVzgkcQiaFs/copy" target="_blank">껍데기 시트 사본 만들기</a>를 누르고 [사본 만들기]</li><li>사본에서 [확장 프로그램] > [Apps Script] > [배포] > [새 배포] > 웹 앱 (실행: 나, 액세스: 모든 사용자)</li><li>나온 주소를 위 칸에 붙여 넣기</li></ol><p class="sub" style="margin:8px 0 0"><a href="https://github.com/MusicalPE/7942#readme" target="_blank">자세한 설치 안내</a> · <a href="?demo">미리보기로 둘러보기</a></p></div></div><p class="center" style="margin-top:12px"><button class="btn sm btn-install hide">선생님 화면을 앱으로 설치</button></p><div class="foot">만든이 음악적체육인</div></main>';
  var w=document.getElementById('wurl'); w.focus();
  w.onkeydown=function(e){ if(e.key==='Enter') go(); };
  document.getElementById('cn').onclick=go;

    rawCall(apiUrl(k),'ping',[]).then(function(p){ if(!p||p.app!=='7942') throw new Error('7942 껍데기가 아닌 것 같아요.'); lsSet(KEY_NAME,k); loginView(); }).catch(function(e){ connectView(e.message||e); });
  }

function loginView(msg){
  if(IS_GAS && !apiKey()){ connectView(); return; }
  root.innerHTML='<main style="max-width:380px;margin-top:80px"><div class="card center">'+(IS_GAS?'':'<div class="demo">미리보기입니다. 아무 비밀번호나 넣으세요.</div>')+
   '<div class="brand" role="img" aria-label="7942" style="margin-top:10px"><span>7</span><span>9</span><span>4</span><span>2</span></div><div class="brand-sub">친구사이 · 선생님</div><input type="password" id="pw" placeholder="비밀번호" style="width:100%;margin:10px 0;font-size:16px;padding:10px">'+
   '<button class="btn main" id="lg" style="width:100%;padding:10px">들어가기</button><div class="err" style="margin-top:8px">'+esc(msg||'')+'</div>'+(IS_GAS?'<p class="sub" style="margin-top:10px"><a href="#" id="unlink">다른 시트 연결하기</a></p>':'')+'</div><p class="center" style="margin-top:12px"><button class="btn sm btn-install hide">선생님 화면을 앱으로 설치</button></p><div class="foot">만든이 음악적체육인</div></main>';

}

function init(d){
  T.shellOld=IS_GAS&&(d.shell||0)<NEED_SHELL;
  T.shellVer=IS_GAS?(d.shell||1):2;
  T.roster=d.roster; T.rounds=d.rounds; T.url=IS_GAS?studentLink():'(배포한 뒤 생기는 학생용 주소)'; T.sheetUrl=d.sheetUrl; T.defaultPw=d.defaultPw;
  var act=T.rounds.filter(function(r){return r.status==='진행중';})[0];
  T.rid = act?act.id:(T.rounds.length?T.rounds[T.rounds.length-1].id:null);
  if(!T.roster.length) T.tab='roster'; else if(!T.rounds.length) T.tab='status';
  loadRound(T.rid).then(draw);
}

/* 5점 척도: 4~5→○, 3→△, 1~2→X 로 바꿔 계산하고, 원래 점수는 raw 에 둠 */
function normV(v){ v=String(v==null?'':v); return v==='5'||v==='4'?'o':v==='3'?'t':v==='2'||v==='1'?'x':v; }
function normResp(list){ return (list||[]).map(function(r){ if(r.raw) return r; var raw=r.rel||{}, rel={}; Object.keys(raw).forEach(function(k){ rel[k]=normV(raw[k]); }); r.raw=raw; r.rel=rel; return r; }); }
function loadRound(rid){
  if(!rid) return Promise.resolve();
  return call('getRoundData',T.token,rid).then(function(d){ T.data[rid]=normResp(d.responses); });
}
function round(rid){ return T.rounds.filter(function(r){return r.id===(rid||T.rid);})[0]; }
function active(){ return T.roster.filter(function(s){return s.status!=='전출';}); }

/* ───────── 분석 ───────── */
function analyze(rid){
  var studs=active(), resp={}; (T.data[rid]||[]).forEach(function(r){ resp[r.sid]=r; });
  var st={};
  studs.forEach(function(s){ st[s.id]={s:s,responded:!!resp[s.id],rO:0,rX:0,rT:0,gO:0,gX:0,gT:0,mutualO:0,mutualX:0,cross:0,praise:[],conflict:[],rSum:0,rCnt:0,gSum:0,gCnt:0}; });
  var has5=false;
  studs.forEach(function(a){ var r=resp[a.id]; if(!r) return;
    studs.forEach(function(b){ if(a.id===b.id) return; var v=r.rel[b.id];
      if(v==='o'){ st[a.id].gO++; st[b.id].rO++; } else if(v==='x'){ st[a.id].gX++; st[b.id].rX++; } else if(v==='t'){ st[a.id].gT++; st[b.id].rT++; }
      var n=+((r.raw||{})[b.id]); if(n>=1&&n<=5){ has5=true; st[b.id].rSum+=n; st[b.id].rCnt++; st[a.id].gSum+=n; st[a.id].gCnt++; } });
    (r.praise||[]).forEach(function(p){ if(st[p.id]) st[p.id].praise.push({from:a.name,reason:p.reason}); });
    (r.conflict||[]).forEach(function(p){ if(st[p.id]) st[p.id].conflict.push({from:a.name,reason:p.reason}); });
  });
  var pairs={};
  for(var i=0;i<studs.length;i++) for(var j=i+1;j<studs.length;j++){
    var a=studs[i], b=studs[j], ra=resp[a.id], rb=resp[b.id]; if(!ra||!rb) continue;
    var v1=ra.rel[b.id], v2=rb.rel[a.id], t='';
    if(v1==='o'&&v2==='o') t='g'; else if(v1==='x'&&v2==='x') t='r'; else if((v1==='o'&&v2==='x')||(v1==='x'&&v2==='o')) t='y';
    pairs[a.id+'|'+b.id]=pairs[b.id+'|'+a.id]=t;
    if(t==='g'){ st[a.id].mutualO++; st[b.id].mutualO++; } if(t==='r'){ st[a.id].mutualX++; st[b.id].mutualX++; } if(t==='y'){ st[a.id].cross++; st[b.id].cross++; }
  }
  var n=Object.keys(resp).length;
  studs.forEach(function(s){ var x=st[s.id]; x.interest=x.rO+x.rX; x.like=x.rO-x.rX;
    x.flags=[];
    if(n>=3){ if(x.rO===0) x.flags.push('받은 ○ 없음'); if(x.rX>=Math.max(3,Math.round((n-1)*0.3))) x.flags.push('X를 많이 받음'); if(x.responded&&x.mutualO===0) x.flags.push('서로 ○ 없음'); }
  });
  studs.forEach(function(x){ var o=st[x.id]; o.rAvg=o.rCnt?Math.round(o.rSum/o.rCnt*10)/10:'-'; o.gAvg=o.gCnt?Math.round(o.gSum/o.gCnt*10)/10:'-'; });
  return {studs:studs,resp:resp,st:st,pairs:pairs,n:n,has5:has5};
}

function seatModel(A,o){
  var studs=A.studs.filter(function(s){ return !o.out[s.id]; }), idx={};
  studs.forEach(function(s,i){ idx[s.id]=i; });
  var n=studs.length, U=[], hard=[], why=[];
  for(var i=0;i<n;i++){ U.push(new Array(n).fill(0)); hard.push(new Array(n).fill('')); }
  function rel(a,b){ var r=A.resp[a.id]; return r?(r.rel[b.id]||''):'?'; }
  // 절대 안 되는 사이
  function ban(a,b,t){ var i=idx[a],j=idx[b]; if(i==null||j==null||i===j) return; if(!hard[i][j]){ hard[i][j]=hard[j][i]=t; } }
  studs.forEach(function(a){ studs.forEach(function(b){ if(a!==b && rel(a,b)==='x') ban(a.id,b.id,'X'); }); });
  studs.forEach(function(a){ var r=A.resp[a.id]; ((r&&r.conflict)||[]).forEach(function(p){ ban(a.id,p.id,'사이가 좋지 않은 친구'); }); });
  seatLoad('sep').forEach(function(p){ ban(p[0],p[1],'선생님이 떼어 놓음'); });
  // 지난 자리
  var hist=o.history?seatLoad('seathist'):[], seen={};
  hist.slice(-3).forEach(function(h,k,arr){ var w=(k===arr.length-1)?5:2; (h.groups||[]).forEach(function(g){ g.forEach(function(a){ g.forEach(function(b){ if(a<b){ var key=a+'|'+b; seen[key]=Math.max(seen[key]||0,w); } }); }); }); });
  var lonely={}; studs.forEach(function(s){ var x=A.st[s.id]; if(A.n>=3 && (x.rO<=1 || x.flags.length)) lonely[s.id]=1; });
  for(var i=0;i<n;i++) for(var j=i+1;j<n;j++){
    var a=studs[i], b=studs[j], v1=rel(a,b), v2=rel(b,a), u=0;

    });

/* ───────── 친구 그룹 (서로 ○로 묶이는 무리) ───────── */
var GCOL=['#4f8f6f','#5b7fb8','#c08a3e','#9a6bb0','#3f9aa0','#b86a6a','#7d8f3c','#c06f9b','#6b7480','#a0773f','#4d6fa0','#8c5a8f'];
function groupsOf(A){
  if(A._g) return A._g;
  var ids=A.studs.filter(function(s){return A.resp[s.id];}).map(function(s){return s.id;});
  var adj={}; ids.forEach(function(a){ adj[a]={}; ids.forEach(function(b){ if(a!==b&&A.pairs[a+'|'+b]==='g') adj[a][b]=1; }); });
  var cliques=[];
  function bk(R,P,X){
    if(!P.length&&!X.length){ if(R.length>=2) cliques.push(R.slice()); return; }
    var piv=P.concat(X).reduce(function(best,u){ var c=P.filter(function(v){return adj[u][v];}).length; return c>best[1]?[u,c]:best; },[null,-1])[0];
    P.filter(function(v){return !adj[piv][v];}).forEach(function(v){
      bk(R.concat([v]),P.filter(function(w){return adj[v][w];}),X.filter(function(w){return adj[v][w];}));
      P=P.filter(function(w){return w!==v;}); X=X.concat([v]);
    });
  }
  bk([],ids.slice(),[]);
  var no={}; A.studs.forEach(function(s){no[s.id]=s.no;});
  function byNo(a,b){return no[a]-no[b];}
  cliques.forEach(function(c){c.sort(byNo);});
  cliques.sort(function(a,b){ return b.length-a.length || no[a[0]]-no[b[0]]; });
  // 겹치지 않게 나누기: 아직 안 묶인 학생이 가장 많이 들어 있는 무리부터
  var used={}, parts=[];
  while(true){
    var best=null,bn=0;
    cliques.forEach(function(c){ var n=c.filter(function(id){return !used[id];}).length; if(n>bn){ bn=n; best=c; } });
    if(!best||bn<2) break;
    var g=best.filter(function(id){return !used[id];}); g.forEach(function(id){used[id]=1;}); parts.push(g);
  }
  var alone=ids.filter(function(id){return !used[id]&&!Object.keys(adj[id]).length;}).sort(byNo);
  var loose=ids.filter(function(id){return !used[id]&&Object.keys(adj[id]).length;}).sort(byNo);
  var nonresp=A.studs.filter(function(s){return !A.resp[s.id];}).map(function(s){return s.id;});
  var all=parts.concat(loose.map(function(id){return [id];})).concat(alone.map(function(id){return [id];}));
  if(nonresp.length) all.push(nonresp);
  var gOf={}; parts.forEach(function(g,k){ g.forEach(function(id){gOf[id]=k;}); });
  // 그룹 사이 관계
  var between=[];
  for(var i=0;i<parts.length;i++) for(var j=i+1;j<parts.length;j++){
    var r=0,y=0,ox=0;
    parts[i].forEach(function(a){ parts[j].forEach(function(b){ var p=A.pairs[a+'|'+b];
      if(p==='r') r++; else if(p==='y') y++;
      else { if(A.resp[a]&&A.resp[a].rel[b]==='x') ox++; if(A.resp[b]&&A.resp[b].rel[a]==='x') ox++; } }); });
    if(r||y||ox) between.push({i:i,j:j,r:r,y:y,ox:ox});
  }
  between.sort(function(a,b){ return (b.r*3+b.y*2+b.ox)-(a.r*3+a.y*2+a.ox); });
  return A._g={cliques:cliques.filter(function(c){return c.length>=3;}),parts:all,groups:parts,gOf:gOf,alone:alone,loose:loose,nonresp:nonresp,between:between,adj:adj};
}

function vGroups(v){
  var A=analyze(T.rid), G=groupsOf(A), nameOf={};
  A.studs.forEach(function(s){nameOf[s.id]=s.name;});
  function chips(arr,cls){ return '<div class="names">'+arr.map(function(id){return '<span class="'+(cls||'')+'">'+esc(nameOf[id])+'</span>';}).join('')+'</div>'; }
  function gname(k){ return '<span class="gdot" style="background:'+GCOL[k%GCOL.length]+'"></span>'+(G.groups[k].length>=3?'그룹 ':'짝 ')+(k+1); }
  var big=G.groups.filter(function(g){return g.length>=3;}).length;
  var h='<div class="card"><h2>친구 그룹 <span class="sub">서로 ○를 누른 학생끼리 자동으로 묶었어요</span></h2>'+
    '<div class="sub">그룹 = 안에 있는 학생 모두가 서로서로 ○를 누른 무리예요. 한 학생이 여러 무리에 걸치면, 더 큰 무리 쪽에 넣었어요(아래 [겹치는 무리 모두 보기]에서 전부 볼 수 있어요). 둘만 서로 ○이면 "짝"으로 보여 줘요. 아직 안 낸 학생은 빠져요.</div></div>';
  h+='<div class="card"><h2>관계 그림</h2><div class="noprint" style="margin-bottom:6px"><label><input type="checkbox" id="sx"'+(T.socX===true?' checked':'')+'> 서로 X 선</label> <label style="margin-left:10px"><input type="checkbox" id="sy"'+(T.socY?' checked':'')+'> 한쪽 ○ 한쪽 X 선</label></div>'+
    '<div class="sub noprint" style="text-align:center">그룹(색 원)이나 아래 그룹 카드를 누르면 그 그룹만 잘 보여요. <a href="#" id="socHint" onclick="return false" style="visibility:hidden">전체 보기</a></div>'+socSvg(A,G)+'<div class="legend" style="justify-content:center"><span><i style="background:#3d9a6a"></i>서로 ○</span><span><i style="background:#c2513f"></i>서로 X</span><span><i style="background:#e0b23c"></i>한쪽 ○, 한쪽 X</span><span>점 색 = 그룹</span><span><b>굵은 이름</b> = 두 무리를 서로 ○로 이어 주는 학생</span><span>점에 마우스를 올리면 그 학생의 선만 진하게</span><span>무리 밖 점 = 서로 ○ 친구가 없는 학생</span></div></div>';
  h+='<div class="card"><h2>그룹 '+big+'개 · 짝 '+(G.groups.length-big)+'개</h2><div class="ggrid">'+
    G.groups.map(function(g,k){
      var xs=G.between.filter(function(b){return b.i===k||b.j===k;});
      return '<div class="gcard" data-g="'+k+'" style="cursor:pointer" title="누르면 관계 그림에서 이 그룹만 보여요"><h3>'+gname(k)+' <span class="sub">'+g.length+'명</span></h3>'+chips(g,'o')+
        (xs.length?'<div class="sub" style="margin-top:6px">'+xs.map(function(b){ var o=b.i===k?b.j:b.i; return (G.groups[o].length>=3?'그룹 ':'짝 ')+(o+1)+'과 '+[b.r?'서로 X '+b.r:'',b.y?'엇갈림 '+b.y:'',b.ox?'한쪽 X '+b.ox:''].filter(Boolean).join(', '); }).join('<br>')+'</div>':'')+'</div>';
    }).join('')+'</div></div>';
  h+='<div class="two"><div class="card"><h2>서로 ○ 친구가 없는 학생 ('+G.alone.length+')</h2>'+(G.alone.length?chips(G.alone,'x')+'<div class="sub" style="margin-top:6px">한번 더 살펴보면 좋은 학생이에요.</div>':'<span class="sub">없음</span>')+
    (G.loose.length?'<h2 style="margin-top:14px">서로 ○ 친구는 있지만 그룹에 안 들어간 학생</h2>'+G.loose.map(function(id){ return '<div style="margin:4px 0"><b>'+esc(nameOf[id])+'</b> <span class="sub">서로 ○: '+Object.keys(G.adj[id]).map(function(x){return esc(nameOf[x]);}).join(', ')+'</span></div>'; }).join(''):'')+'</div>'+
    '<div class="card"><h2>아직 안 낸 학생 ('+G.nonresp.length+')</h2>'+(G.nonresp.length?chips(G.nonresp):'<span class="sub">없음</span>')+'</div></div>';
  h+='<div class="card"><h2>그룹 사이 갈등 <span class="sub">X가 오간 그룹끼리, 많은 순서</span></h2>'+(G.between.length?'<table class="tbl"><tr><th>그룹</th><th>그룹</th><th class="num">서로 X 쌍</th><th class="num">엇갈림 쌍</th><th class="num">한쪽만 X</th></tr>'+
    G.between.map(function(b){ return '<tr><td>'+gname(b.i)+'</td><td>'+gname(b.j)+'</td><td class="num">'+b.r+'</td><td class="num">'+b.y+'</td><td class="num">'+b.ox+'</td></tr>'; }).join('')+'</table>':'<span class="sub">없음</span>')+'</div>';
  h+='<div class="card"><details><summary style="cursor:pointer;font-weight:700">겹치는 무리 모두 보기 ('+G.cliques.length+'개, 3명 이상)</summary><div style="margin-top:8px">'+
    (G.cliques.length?G.cliques.map(function(c){ return '<div style="margin:5px 0">'+chips(c,'o')+'</div>'; }).join(''):'<span class="sub">없음</span>')+'</div></details></div>';
  v.innerHTML=h;
  socApply(document.querySelector('svg.soc'));
  document.getElementById('sx').onchange=function(){ T.socX=this.checked; draw(); };

/* 관계 그림: 그룹을 누르면 그 그룹만, 점에 마우스를 올리면 그 학생 선만 */
function socApply(svg,hover){

    if(hover) o=(l.getAttribute('data-a')===hover||l.getAttribute('data-b')===hover)?1:0.05;
    else if(g!=null) o=(ca===g&&cb===g)?0.95:(ca===g||cb===g)?0.55:0.03;
    l.setAttribute('stroke-opacity',o); });
  var near={}; if(g!=null&&!hover) svg.querySelectorAll('line').forEach(function(l){ if(l.getAttribute('data-ca')===g||l.getAttribute('data-cb')===g){ near[l.getAttribute('data-a')]=1; near[l.getAttribute('data-b')]=1; } });
  svg.querySelectorAll('[data-c]').forEach(function(e){ var id=e.querySelector('[data-n]').getAttribute('data-n'); e.setAttribute('opacity',(g==null||e.getAttribute('data-c')===g||hover===id)?1:near[id]?0.7:0.15); });
  svg.querySelectorAll('[data-gb]').forEach(function(e){ e.setAttribute('opacity',(g==null||e.getAttribute('data-gb')===g)?1:0.25); });
  document.querySelectorAll('.gcard[data-g]').forEach(function(c){ c.classList.toggle('gsel',g!=null&&c.getAttribute('data-g')===g); });
  var hint=document.getElementById('socHint'); if(hint) hint.style.visibility=g==null?'hidden':'visible';
}
document.addEventListener('mouseover',function(e){ var c=e.target.closest&&e.target.closest('.soc [data-n]'); if(c) socApply(c.closest('svg'),c.getAttribute('data-n')); });
document.addEventListener('mouseout',function(e){ var c=e.target.closest&&e.target.closest('.soc [data-n]'); if(c) socApply(c.closest('svg')); });
document.addEventListener('click',function(e){
  if(!e.target.closest) return;
  var b=e.target.closest('.soc [data-gb], .gcard[data-g], .soc [data-c]'), svg=document.querySelector('svg.soc');
  if(!b){ if(e.target.closest('svg.soc')||e.target.closest('#socHint')){ T.socSel=null; socApply(svg); } return; }
  var k=b.getAttribute('data-gb')||b.getAttribute('data-g')||b.getAttribute('data-c');
  if(b.hasAttribute('data-c') && b.getAttribute('data-solo')) { T.socSel=null; socApply(svg); return; }

  if(T.socSel!=null && b.classList.contains('gcard') && svg) svg.scrollIntoView({behavior:'smooth',block:'center'});
});
function socSvg(A,G){
  // 그룹은 한 덩어리(작은 원)로, 그룹 사이는 이어 주는 학생 쪽을 마주 보게 배치
  var clusters=G.parts.map(function(g){ return g.slice(); });
  var inPart={}; G.parts.forEach(function(g){ g.forEach(function(id){ inPart[id]=1; }); });
  A.studs.forEach(function(s){ if(!inPart[s.id]) clusters.push([s.id]); });
  var cOf={}; clusters.forEach(function(c,k){ c.forEach(function(id){ cOf[id]=k; }); });
  var ids=A.studs.map(function(s){ return s.id; }), n=ids.length; if(!n) return '';
  function rel(a,b){ var r=A.resp[a]; return r?r.rel[b]:''; }
  function wt(a,b){ var p=A.pairs[a+'|'+b]; if(p==='g') return 3; return (rel(a,b)==='o'?1:0)+(rel(b,a)==='o'?1:0); }
  var K=clusters.length, CW=[], CX=[];
  for(var i=0;i<K;i++){ CW.push(new Array(K).fill(0)); CX.push(new Array(K).fill(0)); }
  for(var x=0;x<n;x++) for(var y=x+1;y<n;y++){ var a=ids[x], b=ids[y], ca=cOf[a], cb=cOf[b]; if(ca===cb) continue;
    var w=wt(a,b); CW[ca][cb]+=w; CW[cb][ca]+=w; if(A.pairs[a+'|'+b]==='r'){ CX[ca][cb]++; CX[cb][ca]++; } }
  var R=clusters.map(function(c){ return c.length<2?0:Math.max(34,c.length*52/(2*Math.PI)); });
  var B=R.map(function(r,k){ return r+(clusters[k].length<2?34:44); });       // 이름까지 포함한 크기
  // 처음 자리: 큰 그룹부터 나선형으로 (늘 같은 그림이 나오게)
  var P=clusters.map(function(c,k){ var t=k*2.4, d=60+k*26; return {x:Math.cos(t)*d,y:Math.sin(t)*d}; });
  for(var it=0;it<600;it++){
    var F=P.map(function(){ return {x:0,y:0}; }), cool=1-it/600;
    for(var i2=0;i2<K;i2++) for(var j2=i2+1;j2<K;j2++){
      var dx=P[j2].x-P[i2].x, dy=P[j2].y-P[i2].y, d=Math.sqrt(dx*dx+dy*dy)||0.01, ux=dx/d, uy=dy/d, f=0, need=B[i2]+B[j2]+70;
      if(d<need) f-=(need-d)*0.5;                                  // 겹치지 않게
      f-=6000/(d*d);                            // 서로 밀기 (X가 있으면 조금 더)
      if(CW[i2][j2]) f+=(d-need)*0.02*Math.min(CW[i2][j2],6);      // ○로 이어진 그룹은 가까이
      F[i2].x+=ux*f; F[i2].y+=uy*f; F[j2].x-=ux*f; F[j2].y-=uy*f;
    }
    for(var k3=0;k3<K;k3++){ var lone=!clusters[k3].some(function(id){ return CW[k3].some(function(v){ return v>0; }); });
      var g=lone?0.004:0.012; F[k3].x-=P[k3].x*g; F[k3].y-=P[k3].y*g;
      var m=Math.sqrt(F[k3].x*F[k3].x+F[k3].y*F[k3].y), lim=12*cool+1; if(m>lim){ F[k3].x*=lim/m; F[k3].y*=lim/m; }
      P[k3].x+=F[k3].x; P[k3].y+=F[k3].y; }
  }
  for(var it2=0;it2<300;it2++){ var moved=false;
    for(var i5=0;i5<K;i5++) for(var j5=i5+1;j5<K;j5++){ var dx5=P[j5].x-P[i5].x, dy5=P[j5].y-P[i5].y, d5=Math.sqrt(dx5*dx5+dy5*dy5)||0.01, need5=B[i5]+B[j5]+60;
      if(d5<need5){ var push=(need5-d5)/2+0.5; P[i5].x-=dx5/d5*push; P[i5].y-=dy5/d5*push; P[j5].x+=dx5/d5*push; P[j5].y+=dy5/d5*push; moved=true; } }
    if(!moved) break; }
  // 그룹 안 자리: 다른 그룹과 이어진 학생이 그 그룹 쪽을 보게
  // 무리와 무리 사이마다 서로 ○가 가장 많은 한 쌍을 '이어 주는 학생'으로
  var pos={}, bridge={}, keyLine={}, best2={};
  ids.forEach(function(a){ ids.forEach(function(b){ if(a<b && cOf[a]!==cOf[b] && A.pairs[a+'|'+b]==='g'){
    var ka=cOf[a], kb=cOf[b], key=Math.min(ka,kb)+'-'+Math.max(ka,kb);
    var deg=function(x,other){ return ids.filter(function(o){ return cOf[o]===other && A.pairs[x+'|'+o]==='g'; }).length; };
    var sc=deg(a,kb)+deg(b,ka); if(!best2[key]||sc>best2[key].sc) best2[key]={sc:sc,a:a,b:b}; } }); });
  Object.keys(best2).forEach(function(key){ var x=best2[key]; keyLine[x.a+'|'+x.b]=keyLine[x.b+'|'+x.a]=1;
    if(clusters[cOf[x.a]].length>=2) bridge[x.a]=1; if(clusters[cOf[x.b]].length>=2) bridge[x.b]=1; });
  clusters.forEach(function(c,k){
    if(c.length<2){ pos[c[0]]={x:P[k].x,y:P[k].y,t:Math.PI/2,c:k}; return; }
    var pref=c.map(function(id){ var sx=0,sy=0,sw=0; ids.forEach(function(o){ if(cOf[o]===k) return; var w=wt(id,o); if(!w) return; sx+=(P[cOf[o]].x-P[k].x)*w; sy+=(P[cOf[o]].y-P[k].y)*w; sw+=w; });
      return sw?{a:Math.atan2(sy,sx),w:sw}:null; });
    var m=c.length, best=null, bestC=1e9;
    for(var s=0;s<36;s++){ var off=s*2*Math.PI/36/m, free=[], as={}, cost=0;
      for(var q=0;q<m;q++) free.push(q);
      c.map(function(id,i){ return i; }).filter(function(i){ return pref[i]; }).sort(function(a,b){ return pref[b].w-pref[a].w; }).forEach(function(i){
        var bi=-1,bd=9; free.forEach(function(q,fi){ var ang=off+q*2*Math.PI/m, d=Math.abs(Math.atan2(Math.sin(ang-pref[i].a),Math.cos(ang-pref[i].a))); if(d<bd){ bd=d; bi=fi; } });
        as[i]=free[bi]; free.splice(bi,1); cost+=bd*pref[i].w; });
      c.forEach(function(id,i){ if(as[i]==null) as[i]=free.shift(); });
      if(cost<bestC){ bestC=cost; best={off:off,as:as}; } }
    c.forEach(function(id,i){ var t=best.off+best.as[i]*2*Math.PI/m; pos[id]={x:P[k].x+R[k]*Math.cos(t),y:P[k].y+R[k]*Math.sin(t),t:t,c:k}; });
  });
  // 그림 크기 맞추기
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; P.forEach(function(p,k){ x0=Math.min(x0,p.x-B[k]); y0=Math.min(y0,p.y-B[k]); x1=Math.max(x1,p.x+B[k]); y1=Math.max(y1,p.y+B[k]); });
  x0-=16; y0-=16; x1+=16; y1+=16;
  var bg='';
  clusters.forEach(function(c,k){ if(c.length<2) return; var col=GCOL[(G.gOf[c[0]]||0)%GCOL.length];
    bg+='<g data-gb="'+k+'" style="cursor:pointer"><circle cx="'+P[k].x.toFixed(1)+'" cy="'+P[k].y.toFixed(1)+'" r="'+(R[k]+20).toFixed(1)+'" fill="'+col+'" fill-opacity="0.09" stroke="'+col+'" stroke-opacity="0.35" stroke-dasharray="4 4"/>'+
      '<text x="'+P[k].x.toFixed(1)+'" y="'+(P[k].y+5).toFixed(1)+'" text-anchor="middle" font-size="15" fill="'+col+'" fill-opacity="0.45" font-weight="700">'+(c.length>=3?'그룹 ':'짝 ')+(G.gOf[c[0]]+1)+'</text></g>'; });
  var lines='';
  for(var i4=0;i4<n;i4++) for(var j4=i4+1;j4<n;j4++){
    var a4=ids[i4],b4=ids[j4],p4=A.pairs[a4+'|'+b4]; if(!p4) continue;
    if(p4==='r'&&T.socX!==true) continue; if(p4==='y'&&!T.socY) continue;
    var col4=p4==='g'?'#3d9a6a':p4==='r'?'#c2513f':'#e0b23c', same4=cOf[a4]===cOf[b4], br4=keyLine[a4+'|'+b4], w4=p4==='g'?(same4?2.8:(br4?1.8:1)):1.6, op4=p4==='g'?(same4?0.9:(br4?0.6:0.12)):0.6;
    lines+='<line data-a="'+a4+'" data-b="'+b4+'" data-ca="'+cOf[a4]+'" data-cb="'+cOf[b4]+'" data-o="'+op4+'" x1="'+pos[a4].x.toFixed(1)+'" y1="'+pos[a4].y.toFixed(1)+'" x2="'+pos[b4].x.toFixed(1)+'" y2="'+pos[b4].y.toFixed(1)+'" stroke="'+col4+'" stroke-width="'+w4+'" stroke-opacity="'+op4+'"'+(p4==='y'?' stroke-dasharray="5 4"':'')+'/>';
  }
  var nodes='';
  ids.forEach(function(id){ var Q=pos[id], k=G.gOf[id], resp=!!A.resp[id], c=clusters[Q.c];
    var fill=k!=null?GCOL[k%GCOL.length]:(resp?'#b9bcc2':'#fff');
    var lx,ly,anc;
    if(c.length<2){ lx=Q.x; ly=Q.y+24; anc='middle'; }
    else { lx=Q.x+15*Math.cos(Q.t); ly=Q.y+15*Math.sin(Q.t)+4; anc=Math.cos(Q.t)>0.3?'start':Math.cos(Q.t)<-0.3?'end':'middle'; if(Math.sin(Q.t)>0.7) ly+=6; if(Math.sin(Q.t)<-0.7) ly-=4; }
    nodes+='<g data-c="'+Q.c+'"'+(c.length<2?' data-solo="1"':'')+'><circle data-n="'+id+'" style="cursor:pointer" cx="'+Q.x.toFixed(1)+'" cy="'+Q.y.toFixed(1)+'" r="'+(bridge[id]?10:8)+'" fill="'+fill+'" stroke="'+(resp?(bridge[id]?'#2E2A26':'#fff'):'#9aa0a8')+'" stroke-width="2"'+(resp?'':' stroke-dasharray="2 2"')+'/>'+
      '<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="'+anc+'" font-size="13" paint-order="stroke" stroke="#fff" stroke-width="3" fill="'+(resp?'#24272c':'#9aa0a8')+'"'+(bridge[id]?' font-weight="700"':'')+'>'+esc(A.st[id].s.name)+'</text></g>';
  });
  return '<svg class="soc" viewBox="'+x0.toFixed(0)+' '+y0.toFixed(0)+' '+(x1-x0).toFixed(0)+' '+(y1-y0).toFixed(0)+'" xmlns="http://www.w3.org/2000/svg">'+bg+lines+nodes+'</svg>';
}

/* 이름 → 번호 바꾸기 (서술형 답 속 이름까지) */
function makeAnon(studs){
  var tok={}, byTok={}, pairs=[];
  studs.forEach(function(s,i){ var t='학생'+(s.no||('0'+(i+1))); tok[s.id]=t; byTok[t]=s.name; });
  var full={}, given={};
  studs.forEach(function(s){ var n=String(s.name||'').trim(); if(!n) return; full[n]=(full[n]||[]).concat(s.id);
    if(n.length>=3){ var g=n.slice(1); given[g]=(given[g]||[]).concat(s.id); } });
  Object.keys(full).forEach(function(n){ pairs.push([n, full[n].length===1?tok[full[n][0]]:'학생?']); });
  Object.keys(given).forEach(function(g){ if(full[g]) return; pairs.push([g, given[g].length===1?tok[given[g][0]]:'학생?']); });
  pairs.sort(function(a,b){ return b[0].length-a[0].length; });
  function hide(text){
    var s=String(text||''), marks=[];
    pairs.forEach(function(p){ s=s.split(p[0]).join('\u0001'+marks.length+'\u0002'); marks.push(p[1]); });
    return s.replace(/\u0001(\d+)\u0002/g,function(_,k){ return marks[+k]; });
  }
  function show(text){
    // "학생3이" → "강민화가"처럼 이름 끝 받침에 맞춰 조사도 고침
    return String(text==null?'':text).replace(/학생(\d+)(이랑|랑|으로|로|은|는|을|를|과|와|이|가)?([가-힣]?)/g,function(m,n,j,next){
      var nm=byTok['학생'+n]; if(!nm) return m;
      next=next||''; if(!j) return nm+next;
      var c=nm.charCodeAt(nm.length-1)-0xAC00, jong=(c>=0&&c<11172)?c%28:0, has=jong>0;
      var out;
      if(j==='이랑'||j==='랑') out=has?'이랑':'랑';
      else if(j==='으로'||j==='로') out=(has&&jong!==8)?'으로':'로';
      else if(j==='은'||j==='는') out=has?'은':'는';
      else if(j==='을'||j==='를') out=has?'을':'를';
      else if(j==='과'||j==='와') out=has?'과':'와';
      else if(j==='이'&&next){ out=has?'이':''; if(!has&&next==='에') next='예'; }   // "학생3이다·이에요" → "민화다·민화예요"
      else out=has?'이':'가';
      return nm+out+next;
    });
  }
  return {tok:tok,hide:hide,show:show};
}
function deepShow(v,show){ if(typeof v==='string') return show(v); if(Array.isArray(v)) return v.map(function(x){return deepShow(x,show);}); if(v&&typeof v==='object'){ var o={}; Object.keys(v).forEach(function(k){ o[k]=deepShow(v[k],show); }); return o; } return v; }

    '<div class="two" style="margin-top:10px"><div><h3>친구 관계</h3>'+para(r.친구관계)+'<h3>강점</h3>'+li(r.강점,esc)+'<h3>마음</h3>'+para(r.마음)+(r.지난회차와비교?'<h3>지난 회차와 비교</h3>'+para(r.지난회차와비교):'')+'</div>'+
    '<div><h3>걱정되는 점</h3>'+li(r.걱정되는점,esc)+'<h3>지도 제안</h3>'+li(r.지도제안,esc)+'<h3>상담 때 물어볼 말</h3>'+li(r.상담때물어볼말,function(x){return '"'+esc(x)+'"';})+'</div></div>';
  return '<div class="reason" style="font-size:16px"><b>한 줄 요약</b>'+esc(r.한줄요약||'')+'</div>'+
    '<div class="two" style="margin-top:10px"><div><h3>학급 분위기</h3>'+para(r.학급분위기)+'<h3>관계 구조</h3>'+para(r.관계구조)+'<h3>좋은 점</h3>'+li(r.좋은점,esc)+'<h3>다음 회차 때 볼 점</h3>'+li(r.다음회차때볼점,esc)+'</div>'+
    '<div><h3>살펴볼 학생</h3>'+li(r.살펴볼학생,function(x){return '<b>'+esc(x.학생)+'</b> — '+esc(x.까닭)+(x.도움?'<div class="sub">도움: '+esc(x.도움)+'</div>':'');})+
    '<h3>갈등</h3>'+li(r.갈등,function(x){return '<b>'+esc((x.학생들||[]).join(' · '))+'</b> — '+esc(x.내용)+(x.도움?'<div class="sub">도움: '+esc(x.도움)+'</div>':'');})+
    '<h3>학급 활동 제안</h3>'+li(r.학급활동제안,function(x){return '<b>'+esc(x.활동)+'</b>'+(x.방법?'<div class="sub">'+esc(x.방법)+'</div>':'');})+'</div></div>';
}

function bindKeyBox(box,after){
  var s=box.querySelector('.kSave'), d=box.querySelector('.kDel');
  if(s) s.onclick=function(){ var k=box.querySelector('.kIn').value.trim(); if(!/^(AIza|AQ\.)\S{20,}$/.test(k)){ toast('AIza 또는 AQ. 로 시작하는 키를 통째로 넣어 주세요'); return; } lsSet('7942_gemini_key',k); toast('키를 저장했어요'); if(after) after(); };
  if(d) d.onclick=function(){ lsSet('7942_gemini_key',null); toast('키를 지웠어요'); draw(); };
}
function aiStatusLine(){
  var m=aiMode();
  return m==='key'?'내 Gemini 키로 분석해요.':m==='builtin'?'7942의 AI로 분석해요.':m==='trial'?'무료 체험이 <b>'+(AI_TRIAL-aiUsed())+'번</b> 남았어요. 계속 쓰려면 내 Gemini 키를 넣어 주세요.':m==='need'?'무료 체험을 다 썼어요. 내 Gemini 키를 넣어 주세요.':'아직 7942의 AI가 연결되지 않았어요. 내 Gemini 키를 넣으면 바로 쓸 수 있어요.';
}

/* AI 분석 탭 */
function vAI(v){
  if(strNeedLoad(v)) return;
  var A=analyze(T.rid), rd=round();
  if(A.n<3){ v.innerHTML='<div class="card center"><h2>아직 분석할 응답이 적어요</h2><div class="sub">3명 이상 제출하면 AI 분석을 할 수 있어요.</div></div>'; return; }
  T.aiSel=T.aiSel&&A.st[T.aiSel]?T.aiSel:'';
  v.innerHTML='<div class="card"><h2>AI 분석 <span class="sub">'+esc(rd.name)+' · 제출 '+A.n+'명</span></h2>'+
    '<p class="sub">'+aiStatusLine()+'</p>'+
    '<p class="sub">학생 이름은 AI에 보내기 전에 모두 번호로 바꿔요. 서술형 답 속 친구 이름도 바꿔서 보내고, 결과를 받은 뒤 이 화면에서만 이름으로 되돌려요. (별명은 바꾸지 못해요)</p>'+
    '<div class="set-row noprint"><button class="btn main" id="aiClass">학급 전체 분석</button><span style="width:16px"></span>'+
    '<select id="aiStu"><option value="">학생 고르기</option>'+A.studs.filter(function(s){return A.resp[s.id];}).map(function(s){return '<option value="'+s.id+'"'+(s.id===T.aiSel?' selected':'')+'>'+s.no+'. '+esc(s.name)+'</option>';}).join('')+'</select>'+
    '<button class="btn" id="aiOne">이 학생 분석</button> <button class="btn sm" onclick="window.print()">인쇄</button></div>'+
    ((aiMode()!=='builtin'||aiKey())?keyBox():'')+
    '</div><div class="card" id="aiOut"><p class="sub">위에서 [학급 전체 분석]이나 [이 학생 분석]을 눌러 주세요. 한 번 분석한 결과는 이 컴퓨터에 남아 있어서 다시 열어도 바로 보여요.</p></div>';
  var out=document.getElementById('aiOut');
  bindKeyBox(v,function(){ draw(); });
  document.getElementById('aiClass').onclick=function(){ out.innerHTML='<h2>학급 전체</h2><div id="aiBox"></div>'; runAI(T.rid,null,document.getElementById('aiBox')); };
  document.getElementById('aiStu').onchange=function(){ T.aiSel=this.value; };
  document.getElementById('aiOne').onclick=function(){ if(!T.aiSel){ toast('학생을 골라 주세요'); return; } var s=A.st[T.aiSel].s; out.innerHTML='<h2>'+s.no+'. '+esc(s.name)+'</h2><div id="aiBox"></div>'; runAI(T.rid,T.aiSel,document.getElementById('aiBox')); };
  if(!T.aiOpen){ var run=Object.keys(T.aiJobs).filter(function(k){ return T.aiJobs[k].running&&k.indexOf('_'+T.rid+'_')>0; })[0];
    if(run){ var sidR=run.split('_'+T.rid+'_')[1]; T.aiOpen=sidR==='class'?'class':sidR; } }
  if(T.aiOpen){ var o=T.aiOpen; T.aiOpen=null; if(o==='class') document.getElementById('aiClass').click(); else { T.aiSel=o; document.getElementById('aiStu').value=o; document.getElementById('aiOne').click(); } }
}

function statTable(A){
  var rows=A.studs.map(function(s){ return A.st[s.id]; });
  var k=T.sortKey, d=T.sortDir;
  rows.sort(function(a,b){ var x=k==='no'?a.s.no:k==='name'?a.s.name:a[k], y=k==='no'?b.s.no:k==='name'?b.s.name:b[k]; return (x>y?1:x<y?-1:0)*d; });
  var cols=[['no','번호'],['name','이름'],['rO','받은 ○'],['rX','받은 X'],['interest','관심도'],['like','호감도']].concat(A.has5?[['rAvg','받은 평균'],['gAvg','준 평균']]:[]).concat([['gO','긍정성'],['gX','부정성'],['mutualO','서로 ○'],['mutualX','서로 X'],['pc','받은 칭찬']]);
  rows.forEach(function(r){ r.pc=r.praise.length; });
  return '<div class="card"><h2>학생별 통계 <span class="sub">제목을 누르면 정렬돼요. 노란 표시는 한번 더 살펴보면 좋은 학생이에요.</span></h2><div style="overflow:auto"><table class="tbl sortable"><tr>'+
    cols.map(function(c){ return '<th data-k="'+c[0]+'" class="'+(c[0]==='no'||c[0]==='name'?'':'num')+'">'+c[1]+(k===c[0]?(d>0?' ▲':' ▼'):'')+'</th>'; }).join('')+'</tr>'+
    rows.map(function(r){ return '<tr><td>'+r.s.no+'</td><td><a href="#" data-go="'+r.s.id+'">'+esc(r.s.name)+'</a>'+(r.responded?'':' <span class="sub">(미제출)</span>')+r.flags.map(function(f){return '<span class="flag">'+f+'</span>';}).join('')+'</td>'+
      cols.slice(2).map(function(c){return c[0];}).map(function(c){ var val=r[c]; if((c==='gO'||c==='gX'||c==='mutualO'||c==='mutualX'||c==='gAvg')&&!r.responded) val='-'; return '<td class="num">'+val+'</td>'; }).join('')+'</tr>'; }).join('')+
    '</table></div></div>';
}
function bindSort(v){
  v.querySelectorAll('.sortable th').forEach(function(th){ th.onclick=function(){ var k=th.dataset.k; if(T.sortKey===k) T.sortDir*=-1; else { T.sortKey=k; T.sortDir=(k==='no'||k==='name')?1:-1; } draw(); }; });
  v.querySelectorAll('[data-go]').forEach(function(a){ a.onclick=function(e){ e.preventDefault(); T.sel=a.dataset.go; T.tab='student'; draw(); }; });
}

/* 학생별 보기 */
function vStudent(v){
  var A=analyze(T.rid), S=A.studs;
  if(!T.sel||!A.st[T.sel]) T.sel=S.length?S[0].id:null;
  var x=A.st[T.sel], r=A.resp[T.sel], rd=round();
  var nameOf={}; S.forEach(function(s){nameOf[s.id]=s.name;});
  function list(ids,cls){ return ids.length?'<div class="names">'+ids.map(function(i){ return '<span class="'+(cls(i)||'')+'">'+esc(nameOf[i])+'</span>'; }).join('')+'</div>':' <span class="sub">없음</span>'; }
  var others=S.filter(function(s){return s.id!==T.sel;}).map(function(s){return s.id;});
  var gaveO=r?others.filter(function(i){return r.rel[i]==='o';}):[], gaveX=r?others.filter(function(i){return r.rel[i]==='x';}):[];
  var gotO=others.filter(function(i){return A.resp[i]&&A.resp[i].rel[T.sel]==='o';}), gotX=others.filter(function(i){return A.resp[i]&&A.resp[i].rel[T.sel]==='x';});
  function pc(i){ var p=A.pairs[T.sel+'|'+i]; return p==='g'?'m':p==='r'?'x':p==='y'?'':''; }
  var h='<div class="card noprint"><select id="ss">'+S.map(function(s){return '<option value="'+s.id+'"'+(s.id===T.sel?' selected':'')+'>'+s.no+'. '+esc(s.name)+'</option>';}).join('')+'</select> <button class="btn sm" id="pv">◀</button> <button class="btn sm" id="nx">▶</button> <button class="btn sm" onclick="window.print()">인쇄</button>'+(r?' <button class="btn sm main" id="aiGo">AI로 이 학생 분석</button>':'')+'</div>';
  h+='<div class="card"><h2>'+x.s.no+'. '+esc(x.s.name)+' <span class="sub">'+esc(rd.name)+(r?' · '+esc(r.time)+' 제출':' · 아직 안 냄')+'</span>'+x.flags.map(function(f){return '<span class="flag">'+f+'</span>';}).join('')+'</h2>'+
     '<div class="sub">받은 ○ '+x.rO+' · 받은 X '+x.rX+' · 관심도 '+x.interest+' · 호감도 '+x.like+(A.has5?' · 받은 평균 '+x.rAvg+'점'+(r?' · 준 평균 '+x.gAvg+'점':''):'')+(r?' · 긍정성 '+x.gO+' · 부정성 '+x.gX:'')+'</div></div>';
  h+='<div class="two"><div class="card"><h2>이 학생이 표시한 친구</h2><b>○ 친해요</b> <span class="sub">(진한 초록 = 서로 ○)</span>'+list(gaveO,pc)+'<br><b>X 사이가 안 좋아요</b> <span class="sub">(진한 빨강 = 서로 X)</span>'+list(gaveX,pc)+'</div>'+
     '<div class="card"><h2>이 학생을 표시한 친구</h2><b>○를 준 친구</b>'+list(gotO,pc)+'<br><b>X를 준 친구</b>'+list(gotX,pc)+'</div></div>';
  h+='<div class="two"><div class="card"><h2>친구들이 남긴 칭찬 ('+x.praise.length+')</h2>'+(x.praise.length?x.praise.map(function(p){return '<div class="reason"><b>'+esc(p.from)+'</b>'+esc(p.reason||'(이유 없음)')+'</div>';}).join(''):'<span class="sub">없음</span>')+'</div>'+
     '<div class="card"><h2>사이가 좋지 않다고 한 친구 ('+x.conflict.length+')</h2>'+(x.conflict.length?x.conflict.map(function(p){return '<div class="reason"><b>'+esc(p.from)+'</b>'+esc(p.reason||'(이유 없음)')+'</div>';}).join(''):'<span class="sub">없음</span>')+'</div></div>';
  if(r){
    h+='<div class="card"><h2>이 학생의 답</h2>'+rd.settings.questions.map(function(q,i){ return '<div class="reason"><b>'+(i+1)+'. '+esc(q)+'</b>'+esc(r.answers[i]||'')+'</div>'; }).join('')+
      '<div class="reason"><b>칭찬하고 싶은 친구</b>'+((r.praise||[]).map(function(p){return esc((nameOf[p.id]||p.name)+(p.slot?' ('+p.slot.replace(/\d/,'')+')':'')+' : '+(p.reason||''));}).join('\n')||'없음')+'</div>'+
      '<div class="reason"><b>사이가 좋지 않은 친구</b>'+((r.conflict||[]).map(function(p){return esc((nameOf[p.id]||p.name)+' : '+(p.reason||''));}).join('\n')||'없음')+'</div>'+
      '<div class="reason"><b>선생님께 한마디</b>'+esc(r.message||'없음')+'</div></div>';
  }
  var myG=groupsOf(A).cliques.filter(function(c){return c.indexOf(T.sel)>=0;});
  h+='<div class="card"><h2>속한 서로 ○ 그룹 <span class="sub">모두가 서로 ○를 누른 3명 이상 무리</span></h2>'+(myG.length?myG.map(function(c){ return '<div class="names" style="margin:4px 0">'+c.map(function(id){ return '<span class="'+(id===T.sel?'m':'o')+'">'+esc(nameOf[id])+'</span>'; }).join('')+'</div>'; }).join(''):'<span class="sub">없음</span>')+'</div>';
  h+=historyCard(T.sel);
  v.innerHTML=h;
  var ss=document.getElementById('ss'); ss.onchange=function(){ T.sel=ss.value; draw(); };
  var idx=S.findIndex(function(s){return s.id===T.sel;});
  document.getElementById('pv').onclick=function(){ if(idx>0){ T.sel=S[idx-1].id; draw(); } };
  document.getElementById('nx').onclick=function(){ if(idx<S.length-1){ T.sel=S[idx+1].id; draw(); } };
  var ag=document.getElementById('aiGo'); if(ag) ag.onclick=function(){ T.aiOpen=T.sel; T.tab='ai'; draw(); };
  var lh=document.getElementById('loadHist'); if(lh) lh.onclick=function(){ Promise.all(T.rounds.map(function(r){ return T.data[r.id]?null:loadRound(r.id); })).then(draw); };
}
function historyCard(sid){
  if(T.rounds.length<2) return '';
  var missing=T.rounds.some(function(r){return !T.data[r.id];});
  if(missing) return '<div class="card noprint"><h2>회차별 변화</h2><button class="btn sm" id="loadHist">모든 회차 불러오기</button></div>';
  return '<div class="card"><h2>회차별 변화</h2><table class="tbl"><tr><th>회차</th><th class="num">받은 ○</th><th class="num">받은 X</th><th class="num">관심도</th><th class="num">호감도</th><th class="num">긍정성</th><th class="num">부정성</th><th class="num">서로 ○</th><th class="num">받은 칭찬</th></tr>'+
    T.rounds.map(function(r){ var A=analyze(r.id), x=A.st[sid]; if(!x) return '';
      return '<tr><td>'+esc(r.name)+'</td>'+[x.rO,x.rX,x.interest,x.like,x.responded?x.gO:'-',x.responded?x.gX:'-',x.responded?x.mutualO:'-',x.praise.length].map(function(n){return '<td class="num">'+n+'</td>';}).join('')+'</tr>'; }).join('')+'</table></div>';
}

/* 서술형 모아 보기 */
function vAnswers(v){
  var A=analyze(T.rid), rd=round(), list=A.studs.filter(function(s){return A.resp[s.id];});
  var qs=rd.settings.questions.map(function(q,i){ return {t:(i+1)+'. '+q, get:function(r){return r.answers[i];}}; });
  if(rd.settings.askTeacherMessage) qs.push({t:'선생님께 한마디',get:function(r){return r.message;}});
  T.q=T.q||0; if(T.q>=qs.length) T.q=0;
  v.innerHTML='<div class="card noprint"><select id="qs">'+qs.map(function(q,i){return '<option value="'+i+'"'+(i===T.q?' selected':'')+'>'+esc(q.t)+'</option>';}).join('')+'</select> <button class="btn sm" onclick="window.print()">인쇄</button></div>'+
    '<div class="card"><h2>'+esc(qs[T.q].t)+'</h2><table class="tbl">'+list.map(function(s){ var a=qs[T.q].get(A.resp[s.id]); return '<tr><td style="width:110px;white-space:nowrap"><b>'+s.no+'. '+esc(s.name)+'</b></td><td style="white-space:pre-wrap">'+(a?esc(a):'<span class="sub">(비어 있음)</span>')+'</td></tr>'; }).join('')+'</table></div>';
  var qsEl=document.getElementById('qs'); qsEl.onchange=function(){ T.q=+qsEl.value; draw(); };
}

/* 회차 비교 */
function vCompare(v){
  var FR=friendRounds();
  if(FR.length<2){ v.innerHTML='<div class="card center"><h2>비교하려면 회차가 두 개 이상 있어야 해요</h2><div class="sub">다음 설문 때 [새 회차 만들기]를 누르면 지난 회차와 비교할 수 있어요.</div></div>'; return; }

/* 학생 명단·코드 (점퍼스 학생 등록 방식: 붙여넣으면 바로 미리보기 → 확인 후 등록) */
function parseBulk(raw){
  var out=[];
  raw.split('\n').forEach(function(line){
    var t=line.replace(/\r/g,''); if(!t.trim()) return;
    var p=t.split('\t'); if(p.length<2) p=t.split(','); if(p.length<2) p=t.trim().split(/\s+/);
    p=p.map(function(x){return x.trim();});
    if(/^번호$|^no$/i.test(p[0])||/^이름$/.test(p[0])) return;            // 제목 줄
    var no='',name='',g='';
    if(/^\d+\s*번?$/.test(p[0])){ no=p[0].replace(/\D/g,''); name=p[1]||''; g=p[2]||''; } else { name=p[0]; g=p[1]||''; }
    g=/남/.test(g)?'남':/여/.test(g)?'여':'';
    var row={no:no,name:name,gender:g,ok:true,why:''};
    if(!name){ row.ok=false; row.why='이름이 없어요'; }
    else if(T.roster.some(function(s){ return s.name===name && String(s.no)===String(no||s.no); })){ row.ok=false; row.why='이미 등록됨'; }
    else if(no && T.roster.some(function(s){ return String(s.no)===no && s.status!=='전출'; })){ row.ok=false; row.why=no+'번이 이미 있어요'; }
    else if(out.some(function(o){ return o.ok && o.name===name && o.no===no; })){ row.ok=false; row.why='붙여 넣은 내용 안에서 중복'; }
    out.push(row);
  });
  return out;
}

function vRoster(v){
  var R=T.roster, act=active();
  T.rosterDirty=false;
  v.innerHTML=
    '<div class="two">'+
    '<div class="card"><h2>엑셀에서 붙여 넣어 등록</h2>'+
      '<p class="sub">엑셀·구글 시트에서 <b>번호 · 이름 · 성별</b> 세 칸을 복사해서 아래에 붙여 넣으세요. 성별은 비워도 돼요. 직접 칠 때는 띄어쓰기로 구분해도 돼요 (예: <b>3 김하늘 여</b>). 제목 줄이 섞여 있어도 건너뛰어요.</p>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0"><button class="btn sm" id="tpl">엑셀 양식 복사</button><button class="btn sm" id="smp">예시 넣어 보기</button></div>'+
      '<textarea id="bulk" rows="7" style="font-family:Consolas,monospace" placeholder="번호&#9;이름&#9;성별\n1&#9;김하늘&#9;여\n2&#9;박도윤&#9;남"></textarea>'+
      '<div id="bpv" class="hide" style="margin-top:10px"><p class="sub" id="bsum"></p><div style="max-height:260px;overflow:auto"><table class="tbl" id="btbl"></table></div></div>'+
      '<button class="btn main" id="badd" style="margin-top:10px" disabled>등록</button> <span class="sub" id="bmsg"></span>'+
    '</div>'+
    '<div class="card"><h2>한 명만 추가</h2>'+
      '<div class="set-row"><label>번호 <input id="one-no" style="width:64px" value="'+((R.reduce(function(m,s){return Math.max(m,+s.no||0);},0))+1)+'"></label>'+
      '<label>이름 <input id="one-nm" style="width:140px"></label>'+
      '<label>성별 <select id="one-gd"><option value=""></option><option>남</option><option>여</option></select></label>'+
      '<button class="btn main" id="one-add">추가</button></div>'+
      '<p class="sub">등록하면 학생마다 4자리 코드가 자동으로 생겨요. 코드는 회차가 바뀌어도 그대로예요.</p>'+
    '</div></div>'+
    '<div class="card"><h2>등록된 학생 <span class="sub">'+act.length+'명'+(R.length>act.length?' · 전출 '+(R.length-act.length)+'명':'')+'</span></h2>'+
      '<p class="sub">이름·성별·상태를 고친 뒤 [바뀐 내용 저장]을 눌러 주세요. 전학 간 학생은 상태를 "전출"로 바꾸면 설문과 표에서 빠져요. 코드를 잃어버린 학생만 [새 코드]로 바꿔 주세요.</p>'+
      (R.length?'<div style="overflow:auto;margin-top:8px"><table class="tbl" id="rt"><tr><th style="width:70px">번호</th><th>이름</th><th style="width:80px">성별</th><th style="width:90px">상태</th><th style="width:80px">코드</th><th style="width:150px"></th></tr>'+
      R.map(function(s){ return '<tr data-id="'+esc(s.id)+'"'+(s.status==='전출'?' style="opacity:.55"':'')+'><td><input class="no" value="'+esc(s.no)+'" style="width:52px"></td><td><input class="nm" value="'+esc(s.name)+'" style="width:100%"></td>'+
        '<td><select class="gd"><option value=""></option><option'+(s.gender==='남'?' selected':'')+'>남</option><option'+(s.gender==='여'?' selected':'')+'>여</option></select></td>'+
        '<td><select class="st"><option'+(s.status!=='전출'?' selected':'')+'>재학</option><option'+(s.status==='전출'?' selected':'')+'>전출</option></select></td>'+
        '<td class="cd"><span class="cdl">코드 </span><b style="letter-spacing:2px">'+esc(s.code)+'</b></td><td class="bt"><button class="btn sm" data-rg="'+s.id+'">새 코드</button> <button class="btn sm warn" data-del="'+s.id+'">빼기</button></td></tr>'; }).join('')+'</table></div>'+
      '<div class="noprint" style="display:flex;gap:6px;margin-top:10px"><span style="flex:1"></span><button class="btn main" id="sv" disabled>바뀐 내용 저장</button></div>'
      :'<p class="sub" style="margin-top:8px">아직 등록된 학생이 없어요. 위에서 붙여 넣거나 한 명씩 추가해 주세요.</p>')+
    '</div>'+
    (act.length?'<div class="card"><h2>코드 카드 <span class="sub">잘라서 나눠 주세요</span></h2><div class="noprint" style="margin-bottom:10px"><button class="btn sm" id="pr">코드 카드만 인쇄</button> <button class="btn sm warn" id="rgAll">모든 코드 새로 만들기</button></div>'+
    '<div class="codes" id="codes">'+act.map(function(s){ return '<div class="codecard"><div class="n">'+s.no+'. '+esc(s.name)+'</div><div class="c">'+esc(s.code)+'</div><div class="u">7942 친구사이에 들어갈 때 이 숫자를 넣어요</div></div>'; }).join('')+'</div></div>':'');

  /* 붙여 넣기 미리보기 */
  var bulk=document.getElementById('bulk'), parsed=[];
  function preview(){
    parsed=bulk.value.trim()?parseBulk(bulk.value):[];
    var pv=document.getElementById('bpv'), b=document.getElementById('badd');
    if(!parsed.length){ pv.classList.add('hide'); b.disabled=true; b.textContent='등록'; return; }
    pv.classList.remove('hide');
    var ok=parsed.filter(function(r){return r.ok;}).length;
    document.getElementById('bsum').textContent='총 '+parsed.length+'줄 중 '+ok+'명 등록 예정'+(parsed.length-ok?', '+(parsed.length-ok)+'줄 제외':'');
    document.getElementById('btbl').innerHTML='<tr><th>번호</th><th>이름</th><th>성별</th><th>확인</th></tr>'+parsed.map(function(r){
      return '<tr style="opacity:'+(r.ok?1:.6)+'"><td>'+esc(r.no||'자동')+'</td><td><b>'+esc(r.name)+'</b></td><td>'+esc(r.gender||'-')+'</td><td>'+(r.ok?'<span class="pill on">등록 예정</span>':'<span class="pill" style="background:#fbe7e3;color:#9b3a2b">'+esc(r.why)+'</span>')+'</td></tr>'; }).join('');
    b.disabled=!ok; b.textContent=ok?ok+'명 등록':'등록';
  }
  bulk.oninput=preview;
  document.getElementById('tpl').onclick=function(){
    var tpl='번호\t이름\t성별\n1\t\t\n2\t\t\n3\t\t\n';
    try{ navigator.clipboard.writeText(tpl).then(function(){ toast('양식을 복사했어요. 엑셀에 붙여 넣고 채운 뒤 다시 복사해 오세요'); }); }catch(e){ toast('복사가 막혀 있어요'); }
  };
  document.getElementById('smp').onclick=function(){ bulk.value='번호\t이름\t성별\n1\t김하늘\t여\n2\t박도윤\t남\n3\t이서아\t여'; preview(); };
  function addRows(rows,msg){
    var next=T.roster.reduce(function(m,s){return Math.max(m,+s.no||0);},0);
    var all=T.roster.map(function(s){return {id:s.id,no:s.no,name:s.name,gender:s.gender,status:s.status};})
      .concat(rows.map(function(r){ return {no:r.no||(++next),name:r.name,gender:r.gender,status:'재학'}; }));
    return call('saveRoster',T.token,all).then(function(x){ T.roster=x; draw(); toast(msg); }).catch(fail);
  }
  document.getElementById('badd').onclick=function(){
    var rows=parsed.filter(function(r){return r.ok;}); if(!rows.length) return;
    this.disabled=true; this.textContent='등록하는 중...';
    addRows(rows,rows.length+'명을 등록했어요. 코드가 만들어졌어요');
  };
  document.getElementById('one-add').onclick=function(){
    var nm=document.getElementById('one-nm').value.trim(), no=document.getElementById('one-no').value.trim();
    if(!nm){ toast('이름을 넣어 주세요'); return; }
    var r=parseBulk((no||'')+'\t'+nm+'\t'+document.getElementById('one-gd').value)[0];
    if(!r||!r.ok){ toast(r?r.why:'다시 확인해 주세요'); return; }
    addRows([r],nm+' 학생을 추가했어요');
  };

  /* 등록된 학생 고치기 */
  var sv=document.getElementById('sv');
  v.querySelectorAll('#rt input, #rt select').forEach(function(el){ el.addEventListener('input',function(){ T.rosterDirty=true; if(sv) sv.disabled=false; }); el.addEventListener('change',function(){ T.rosterDirty=true; if(sv) sv.disabled=false; }); });
  function collect(){ return [].map.call(v.querySelectorAll('#rt tr[data-id]'),function(tr){ return {id:tr.dataset.id,no:tr.querySelector('.no').value,name:tr.querySelector('.nm').value.trim(),gender:tr.querySelector('.gd').value,status:tr.querySelector('.st').value}; }); }
  if(sv) sv.onclick=function(){ call('saveRoster',T.token,collect()).then(function(x){ T.roster=x; draw(); toast('저장했어요'); }).catch(fail); };
  v.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){
    var s=T.roster.filter(function(x){return x.id===b.dataset.del;})[0];
    modal('<h2>'+esc(s.name)+' 학생 빼기</h2><div class="sub">잘못 넣은 학생일 때만 빼 주세요. 전학 간 학생은 상태를 "전출"로 바꾸는 게 좋아요(지난 회차 기록에 이름이 남아요).</div>',
      [['취소'],['빼기',function(){ call('saveRoster',T.token,T.roster.filter(function(x){return x.id!==s.id;}).map(function(x){return {id:x.id,no:x.no,name:x.name,gender:x.gender,status:x.status};})).then(function(x){ T.roster=x; draw(); toast('뺐어요'); }).catch(fail); },'warn']]);
  }; });
  v.querySelectorAll('[data-rg]').forEach(function(b){ b.onclick=function(){ call('regenCodes',T.token,[b.dataset.rg]).then(function(x){ T.roster=x; draw(); toast('새 코드를 만들었어요'); }).catch(fail); }; });
  var rgAll=document.getElementById('rgAll'); if(rgAll) rgAll.onclick=function(){ modal('<h2>모든 코드 새로 만들기</h2><div class="sub">지금 나눠 준 코드는 모두 못 쓰게 돼요. 새 카드를 다시 나눠 줘야 해요.</div>',[['취소'],['새로 만들기',function(){ call('regenCodes',T.token,null).then(function(x){ T.roster=x; draw(); toast('모든 코드를 새로 만들었어요'); }).catch(fail); },'warn']]); };
  var pr=document.getElementById('pr'); if(pr) pr.onclick=function(){
    var w=window.open('','_blank');
    if(!w){ toast('팝업이 막혀 있어요'); return; }
    w.document.write('<html><head><meta charset="utf-8"><title>7942 코드 카드</title><style>body{font-family:"Malgun Gothic",sans-serif;margin:10mm}.codes{display:grid;grid-template-columns:repeat(4,1fr)}.codecard{border:1px dashed #999;padding:14px 8px;text-align:center;page-break-inside:avoid}.n{font-size:14px}.c{font-size:32px;font-weight:800;letter-spacing:6px;margin:4px 0}.u{font-size:10px;color:#777}</style></head><body>'+document.getElementById('codes').outerHTML+'</body></html>');
    w.document.close(); w.focus(); setTimeout(function(){ w.print(); },300);
  };
}

/* 새로 고침해도 로그인 유지 (6시간, 같은 시트일 때만) */
function tkSave(t){ if(DEMO_MODE) return; if(t) lsSet('7942_ttok',JSON.stringify({t:t,k:apiKey(),exp:Date.now()+6*3600*1000-60000})); else lsSet('7942_ttok',null); }
(function(){
  var sv=null; try{ sv=JSON.parse(lsGet('7942_ttok')||'null'); }catch(e){}
  if(IS_GAS&&sv&&sv.t&&sv.k===apiKey()&&sv.exp>Date.now()){
    T.token=sv.t;
    root.innerHTML='<main style="max-width:380px;margin-top:120px"><div class="card center"><div class="sub">불러오는 중...</div></div></main>';
    call('teacherInit',sv.t).then(init).catch(function(){ tkSave(null); T.token=null; loginView(); });
  } else loginView();
})();
