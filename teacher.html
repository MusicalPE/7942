<style>
  :root{

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5}

  .mx-wrap{overflow:auto;max-height:75vh;border:1px solid var(--line);border-radius:10px;background:#fff}
  .mx td,.mx th{border:1px solid #ecebe6;width:30px;min-width:30px;height:30px;text-align:center;font-size:14px;padding:0}

  .mx td.v-o{color:var(--o);font-weight:700} .mx td.v-x{color:var(--x);font-weight:700} .mx td.v-t{color:#b5b8bd}
  .mx td.nr{background:repeating-linear-gradient(45deg,#fff,#fff 4px,#f3f2ee 4px,#f3f2ee 8px)}
  .mx tr.foot th,.mx tr.foot td{background:#fafaf8;font-size:13px}
  .mx td.hl,.mx th.hl{outline:2px solid var(--main);outline-offset:-2px}
  .mx td.gl,.mx th.gl{border-left:3px solid #4a4f57} .mx tr.gt>*{border-top:3px solid #4a4f57}
  .gcard{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
  .gcard h3{margin:0 0 6px;font-size:15px}
  .ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .gdot{display:inline-block;width:12px;height:12px;border-radius:6px;vertical-align:-1px;margin-right:6px}
  .soc{width:100%;max-width:760px;display:block;margin:0 auto}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;margin:8px 0}
  .legend span i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:860px){ .two{grid-template-columns:1fr} }
  .names{display:flex;flex-wrap:wrap;gap:6px}
  .names span{padding:3px 9px;border-radius:14px;font-size:13px;background:#f1f0ec}
  .names span.o{background:#e2f3e9;color:#1f6b45} .names span.x{background:#fbe7e3;color:#9b3a2b} .names span.m{background:var(--g);font-weight:700}
  .reason{border-left:3px solid var(--line);padding:4px 10px;margin:6px 0;white-space:pre-wrap}
  .reason b{display:block;font-size:13px;color:var(--sub)}
  .flag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;background:#fff1d6;color:#8a5a00;margin-left:4px;font-weight:600}
  .up{color:#1f7a4d;font-weight:700} .down{color:#b2412f;font-weight:700} .same{color:#999}
  .err{color:var(--x);font-weight:600}
  .center{text-align:center}
  .hide{display:none!important}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#24272c;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:20}
  .codes{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
  .codecard{border:1px dashed #bbb;padding:14px 10px;text-align:center;page-break-inside:avoid}
  .codecard .n{font-size:14px} .codecard .c{font-size:32px;font-weight:800;letter-spacing:6px;margin:4px 0}
  .codecard .u{font-size:10px;color:#777;word-break:break-all}
  .modal{position:fixed;inset:0;background:rgba(20,22,26,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
  .modal .box{background:#fff;border-radius:14px;padding:20px;max-width:460px;width:100%;max-height:92vh;overflow:auto}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .brand{font-size:52px;font-weight:900;letter-spacing:4px;color:var(--main);line-height:1}
  .brand-sub{font-size:14px;color:var(--sub);letter-spacing:5px;margin-top:6px}
  .foot{text-align:center;color:#a3a7ad;font-size:12px;margin-top:16px}
  .demo{background:#fff3cd;border:1px solid #f0d58a;border-radius:8px;padding:6px 10px;font-size:13px}
  .set-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
  .qrow{display:flex;gap:6px;margin:6px 0} .qrow input{flex:1}
  @media print{
    header,.tabs,.noprint{display:none!important}
    body{background:#fff} main{padding:0} .card{border:0;padding:0}
    .mx-wrap{max-height:none;overflow:visible;border:0}
    .mx th.cn,.mx th.rn,.mx th.corner{position:static}
    .mx td.g,.mx td.r,.mx td.y,.mx td.self{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>

<script>
var KEY_NAME='7942_tkey';
/* ───── 연결 (GitHub 화면 ↔ 선생님 시트 껍데기) ───── */
var APP_VER='1.3.0', NEED_SHELL=1;
var Q=new URLSearchParams(location.search);
var DEMO_MODE=Q.has('demo');
var IS_GAS=!DEMO_MODE;
function keyFrom(s){ s=String(s||'').trim(); var m=s.match(/\/s\/([A-Za-z0-9_-]{20,})\/(exec|dev)/); if(m) return m[1]; return /^[A-Za-z0-9_-]{20,}$/.test(s)?s:''; }
function lsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
function lsGet(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
function apiKey(){ var k=keyFrom(Q.get('k')); if(k){ lsSet(KEY_NAME,k); return k; } return keyFrom(lsGet(KEY_NAME)); }
(function(){ var k=keyFrom(Q.get('k')); if(k){ lsSet(KEY_NAME,k); try{ history.replaceState(null,'',location.pathname+(DEMO_MODE?'?demo':'')); }catch(e){} Q.delete('k'); } })();
function apiUrl(k){ k=k||apiKey(); return k?'https://script.google.com/macros/s/'+k+'/exec':''; }
function studentLink(k){ var base=location.href.split('?')[0].split('#')[0].replace(/teacher\.html$/,''); return base+'?k='+(k||apiKey()); }
function rawCall(url,fn,args){
  return fetch(url,{method:'POST',body:JSON.stringify({fn:fn,args:args||[]})})
    .then(function(r){ return r.text(); },function(){ throw new Error('인터넷 연결이나 시트 주소를 확인해 주세요.'); })
    .then(function(t){ var j; try{ j=JSON.parse(t); }catch(e){ throw new Error('시트 껍데기에서 답이 오지 않아요. 웹 앱 배포의 "액세스 권한"이 "모든 사용자"인지 확인해 주세요.'); }
      if(!j.ok) throw new Error(j.error); return j.data; });
}
function call(fn){
  var args=[].slice.call(arguments,1);
  if(DEMO_MODE) return new Promise(function(res,rej){ setTimeout(function(){ try{ res(JSON.parse(JSON.stringify(DEMO[fn].apply(null,args)))); }catch(e){ rej(e); } },200); });
  var u=apiUrl(); if(!u) return Promise.reject(new Error('연결된 시트가 없어요.'));
  return rawCall(u,fn,args);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(t){ var d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(function(){d.remove();},2200); }
function fail(e){ toast(e&&e.message?e.message:String(e)); }

/* ───────── 미리보기용 가상 서버(지어낸 이름) ───────── */
var DEMO=(function(){
  var seed=7; function rnd(){ seed=(seed*16807)%2147483647; return seed/2147483647; }
  var nm=[['김하늘','여'],['박도윤','남'],['이서아','여'],['최민준','남'],['정하린','여'],['강지호','남'],['윤소율','여'],['장시우','남'],['한예린','여'],['오준서','남'],['신다은','여'],['임건우','남'],
          ['서지안','여'],['권우진','남'],['황채원','여'],['송태윤','남'],['안유나','여'],['류승현','남'],['전서윤','여'],['홍은호','남'],['문아인','여'],['배주원','남']];
  var roster=nm.map(function(n,i){ return {id:'S'+(i+1),no:i+1,name:n[0],gender:n[1],code:String(2000+Math.floor(rnd()*7000)),status:'재학'}; });
  var base={title:'우리반 친구들은?!',intro:'우리 반 친구들과 함께 지내면서 느낀 점을 솔직하게 써 보세요. 여러분이 쓴 내용은 선생님만 볼 수 있어요.',
    questions:['우리 반은 "나"에게 어떤 반인가요?','나는 우리 반 친구들에게 어떤 아이일까요?','지금까지 지내면서 좋았던 점은?','지금까지 지내면서 어려웠던 점은?','우리 반에게 바라는 점은 무엇인가요?'],
    requireAllRelations:true,praiseMode:'gender',praiseMale:1,praiseFemale:1,praiseAny:2,praiseRequired:true,
    praiseQuestion:'이 친구가 친구 관계에서 칭찬받을 점은 무엇인가요? 이 친구와 친해지고 싶은 이유는?',conflictMax:2,
    conflictQuestion:'이 친구가 친구 관계에서 고쳐야 할 점은 무엇인가요? 이 친구와 사이가 좋지 않은 이유는?',askTeacherMessage:true};
  var rounds=[{id:'R1',name:'1회차(5월)',created:'2026-05-27',status:'마감',settings:base},{id:'R2',name:'2회차(10월)',created:'2026-10-20',status:'진행중',settings:base}];
  var ans=[['편하고 재미있는 반','장난을 잘 치는 아이','체육 시간이 즐거웠다','모둠 활동 때 의견이 안 맞았다','서로 배려했으면 좋겠다'],
           ['가끔 시끄럽지만 좋은 반','조용한 편인 아이','친구가 많이 생겼다','쉬는 시간에 혼자 있을 때가 있었다','다 같이 노는 시간이 많았으면']];
  function gen(rid,drift){
    var out=[];
    roster.forEach(function(a,ai){
      if(rid==='R2'&&ai===20) return; // 미제출 1명
      var rel={};
      roster.forEach(function(b,bi){ if(a===b) return;
        var same=a.gender===b.gender, near=Math.abs(ai-bi)<5;
        var p=rnd(), po=same?0.55:0.25; if(near) po+=0.15; if(bi===8) po-=0.4; if(ai===3||ai===11) po-=0.25;
        po+=drift*(bi===8?0.35:0.05);
        var px=0.06+(bi===8?0.25-drift*0.2:0)+((ai===3&&bi===11)||(ai===11&&bi===3)?0.9:0);
        rel[b.id]= p<po?'o':(p>1-px?'x':'t');
      });
      var os=roster.filter(function(b){return rel[b.id]==='o';});
      var praise=[], m=os.filter(function(b){return b.gender==='남';})[0], f=os.filter(function(b){return b.gender==='여';})[0];
      if(m) praise.push({id:m.id,name:m.name,slot:'남1',reason:'친절하게 도와줘서'}); if(f) praise.push({id:f.id,name:f.name,slot:'여1',reason:'같이 놀면 재미있어서'});
      var xs=roster.filter(function(b){return rel[b.id]==='x';}).slice(0,1).map(function(b){return {id:b.id,name:b.name,reason:'말을 함부로 할 때가 있어서'};});
      out.push({rid:rid,sid:a.id,no:a.no,name:a.name,time:rid==='R1'?'2026-05-27 10:1'+(ai%10):'2026-10-20 09:5'+(ai%10),answers:ans[ai%2],rel:rel,praise:praise,conflict:xs,message:ai%3?'':'선생님 항상 고맙습니다'});
    });
    return out;
  }
  var resp={R1:gen('R1',0),R2:gen('R2',1)};
  return {
    teacherLogin:function(){ return 'demo'; },
    teacherInit:function(){ return {roster:roster,rounds:rounds,url:'(배포한 웹앱 주소)',sheetUrl:'#',defaultPw:true}; },
    getRoundData:function(t,rid){ return {rid:rid,responses:resp[rid]||[]}; },
    createRound:function(t,name){ rounds.forEach(function(r){ if(r.status==='진행중') r.status='마감'; }); var id='R'+(rounds.length+1); rounds.push({id:id,name:name,created:'2026-11-09',status:'진행중',settings:JSON.parse(JSON.stringify(rounds[rounds.length-1].settings))}); resp[id]=[]; return rounds; },
    updateRound:function(t,rid,p){ rounds.forEach(function(r){ if(r.id===rid){ if(p.name!=null) r.name=p.name; if(p.status) r.status=p.status; if(p.settings) r.settings=p.settings; } else if(p.status==='진행중'&&r.status==='진행중') r.status='마감'; }); return rounds; },
    deleteRound:function(t,rid){ rounds=rounds.filter(function(r){return r.id!==rid;}); return rounds; },
    resetResponse:function(t,rid,sid){ resp[rid]=resp[rid].filter(function(r){return r.sid!==sid;}); return resp[rid]; },
    saveRoster:function(t,rows){ var old={}; roster.forEach(function(s){old[s.id]=s;}); roster=rows.filter(function(r){return r.name;}).map(function(r,i){ var o=old[r.id]; return {id:o?o.id:'N'+Date.now()+i,no:+r.no,name:r.name,gender:r.gender,code:o?o.code:String(1000+Math.floor(Math.random()*9000)),status:r.status||'재학'}; }); return roster; },
    regenCodes:function(t,ids){ roster.forEach(function(s){ if(!ids||ids.indexOf(s.id)>=0) s.code=String(1000+Math.floor(Math.random()*9000)); }); return roster; },
    exportMatrix:function(){ return '#'; },
    changePassword:function(){ return true; }
  };
})();

/* ───────── 상태 ───────── */
var T={ token:null, roster:[], rounds:[], rid:null, data:{}, tab:'status', url:'', sheetUrl:'', sel:null, cmpA:null, cmpB:null, sortKey:'no', sortDir:1 };
var root=document.getElementById('root');

function connectView(msg){
  root.innerHTML='<main style="max-width:560px;margin-top:60px"><div class="card"><div class="center"><div class="brand">7942</div><div class="brand-sub">친구사이 · 선생님</div></div>'+
   '<h2 style="margin-top:18px">내 시트 연결하기</h2><div class="sub">껍데기 시트를 웹 앱으로 배포하고 나온 주소(https://script.google.com/macros/s/.../exec)를 붙여 넣으세요. 이 기기에 기억되어 다음부터는 바로 열려요.</div>'+
   '<input id="wurl" placeholder="https://script.google.com/macros/s/..../exec" style="width:100%;margin:10px 0;padding:10px">'+
   '<button class="btn main" id="cn" style="width:100%;padding:10px">연결하기</button><div class="err" style="margin-top:8px">'+esc(msg||'')+'</div>'+
   '<div class="card" style="background:#f7f6f2;margin:14px 0 0"><b>아직 껍데기 시트가 없다면</b><ol class="sub" style="margin:6px 0 0;padding-left:18px"><li><a href="https://docs.google.com/spreadsheets/d/1x-yX5q_4KDUINBTxxXw7Oc7cbsWddgakaVzgkcQiaFs/copy" target="_blank">껍데기 시트 사본 만들기</a>를 누르고 [사본 만들기]</li><li>사본에서 [확장 프로그램] > [Apps Script] > [배포] > [새 배포] > 웹 앱 (실행: 나, 액세스: 모든 사용자)</li><li>나온 주소를 위 칸에 붙여 넣기</li></ol><p class="sub" style="margin:8px 0 0"><a href="https://github.com/MusicalPE/7942#readme" target="_blank">자세한 설치 안내</a> · <a href="?demo">미리보기로 둘러보기</a></p></div></div><div class="foot">만든이 음악적체육인</div></main>';
  var w=document.getElementById('wurl'); w.focus();
  w.onkeydown=function(e){ if(e.key==='Enter') go(); };

function analyze(rid){
  var studs=active(), resp={}; (T.data[rid]||[]).forEach(function(r){ resp[r.sid]=r; });
  var st={};
  studs.forEach(function(s){ st[s.id]={s:s,responded:!!resp[s.id],rO:0,rX:0,rT:0,gO:0,gX:0,gT:0,mutualO:0,mutualX:0,cross:0,praise:[],conflict:[]}; });
  studs.forEach(function(a){ var r=resp[a.id]; if(!r) return;
    studs.forEach(function(b){ if(a.id===b.id) return; var v=r.rel[b.id];
      if(v==='o'){ st[a.id].gO++; st[b.id].rO++; } else if(v==='x'){ st[a.id].gX++; st[b.id].rX++; } else if(v==='t'){ st[a.id].gT++; st[b.id].rT++; } });
    (r.praise||[]).forEach(function(p){ if(st[p.id]) st[p.id].praise.push({from:a.name,reason:p.reason}); });
    (r.conflict||[]).forEach(function(p){ if(st[p.id]) st[p.id].conflict.push({from:a.name,reason:p.reason}); });
  });
  var pairs={};
  for(var i=0;i<studs.length;i++) for(var j=i+1;j<studs.length;j++){
    var a=studs[i], b=studs[j], ra=resp[a.id], rb=resp[b.id]; if(!ra||!rb) continue;
    var v1=ra.rel[b.id], v2=rb.rel[a.id], t='';
    if(v1==='o'&&v2==='o') t='g'; else if(v1==='x'&&v2==='x') t='r'; else if((v1==='o'&&v2==='x')||(v1==='x'&&v2==='o')) t='y';
    pairs[a.id+'|'+b.id]=pairs[b.id+'|'+a.id]=t;
    if(t==='g'){ st[a.id].mutualO++; st[b.id].mutualO++; } if(t==='r'){ st[a.id].mutualX++; st[b.id].mutualX++; } if(t==='y'){ st[a.id].cross++; st[b.id].cross++; }
  }
  var n=Object.keys(resp).length;
  studs.forEach(function(s){ var x=st[s.id]; x.interest=x.rO+x.rX; x.like=x.rO-x.rX;
    x.flags=[];
    if(n>=3){ if(x.rO===0) x.flags.push('받은 ○ 없음'); if(x.rX>=Math.max(3,Math.round((n-1)*0.3))) x.flags.push('X를 많이 받음'); if(x.responded&&x.mutualO===0) x.flags.push('서로 ○ 없음'); }
  });
  return {studs:studs,resp:resp,st:st,pairs:pairs,n:n};
}

/* ───────── 친구 그룹 (서로 ○로 묶이는 무리) ───────── */
var GCOL=['#4f8f6f','#5b7fb8','#c08a3e','#9a6bb0','#3f9aa0','#b86a6a','#7d8f3c','#c06f9b','#6b7480','#a0773f','#4d6fa0','#8c5a8f'];
function groupsOf(A){
  if(A._g) return A._g;
  var ids=A.studs.filter(function(s){return A.resp[s.id];}).map(function(s){return s.id;});
  var adj={}; ids.forEach(function(a){ adj[a]={}; ids.forEach(function(b){ if(a!==b&&A.pairs[a+'|'+b]==='g') adj[a][b]=1; }); });
  var cliques=[];
  function bk(R,P,X){
    if(!P.length&&!X.length){ if(R.length>=2) cliques.push(R.slice()); return; }
    var piv=P.concat(X).reduce(function(best,u){ var c=P.filter(function(v){return adj[u][v];}).length; return c>best[1]?[u,c]:best; },[null,-1])[0];
    P.filter(function(v){return !adj[piv][v];}).forEach(function(v){
      bk(R.concat([v]),P.filter(function(w){return adj[v][w];}),X.filter(function(w){return adj[v][w];}));
      P=P.filter(function(w){return w!==v;}); X=X.concat([v]);
    });
  }
  bk([],ids.slice(),[]);
  var no={}; A.studs.forEach(function(s){no[s.id]=s.no;});
  function byNo(a,b){return no[a]-no[b];}
  cliques.forEach(function(c){c.sort(byNo);});
  cliques.sort(function(a,b){ return b.length-a.length || no[a[0]]-no[b[0]]; });
  // 겹치지 않게 나누기: 아직 안 묶인 학생이 가장 많이 들어 있는 무리부터
  var used={}, parts=[];
  while(true){
    var best=null,bn=0;
    cliques.forEach(function(c){ var n=c.filter(function(id){return !used[id];}).length; if(n>bn){ bn=n; best=c; } });
    if(!best||bn<2) break;
    var g=best.filter(function(id){return !used[id];}); g.forEach(function(id){used[id]=1;}); parts.push(g);
  }
  var alone=ids.filter(function(id){return !used[id]&&!Object.keys(adj[id]).length;}).sort(byNo);
  var loose=ids.filter(function(id){return !used[id]&&Object.keys(adj[id]).length;}).sort(byNo);
  var nonresp=A.studs.filter(function(s){return !A.resp[s.id];}).map(function(s){return s.id;});
  var all=parts.concat(loose.map(function(id){return [id];})).concat(alone.map(function(id){return [id];}));
  if(nonresp.length) all.push(nonresp);
  var gOf={}; parts.forEach(function(g,k){ g.forEach(function(id){gOf[id]=k;}); });
  // 그룹 사이 관계
  var between=[];
  for(var i=0;i<parts.length;i++) for(var j=i+1;j<parts.length;j++){
    var r=0,y=0,ox=0;
    parts[i].forEach(function(a){ parts[j].forEach(function(b){ var p=A.pairs[a+'|'+b];
      if(p==='r') r++; else if(p==='y') y++;
      else { if(A.resp[a]&&A.resp[a].rel[b]==='x') ox++; if(A.resp[b]&&A.resp[b].rel[a]==='x') ox++; } }); });
    if(r||y||ox) between.push({i:i,j:j,r:r,y:y,ox:ox});
  }
  between.sort(function(a,b){ return (b.r*3+b.y*2+b.ox)-(a.r*3+a.y*2+a.ox); });
  return A._g={cliques:cliques.filter(function(c){return c.length>=3;}),parts:all,groups:parts,gOf:gOf,alone:alone,loose:loose,nonresp:nonresp,between:between,adj:adj};
}

    G.between.map(function(b){ return '<tr><td>'+gname(b.i)+'</td><td>'+gname(b.j)+'</td><td class="num">'+b.r+'</td><td class="num">'+b.y+'</td><td class="num">'+b.ox+'</td></tr>'; }).join('')+'</table>':'<span class="sub">없음</span>')+'</div>';
  h+='<div class="card"><details><summary style="cursor:pointer;font-weight:700">겹치는 무리 모두 보기 ('+G.cliques.length+'개, 3명 이상)</summary><div style="margin-top:8px">'+
    (G.cliques.length?G.cliques.map(function(c){ return '<div style="margin:5px 0">'+chips(c,'o')+'</div>'; }).join(''):'<span class="sub">없음</span>')+'</div></details></div>';

function socSvg(A,G){
  var order=[]; G.parts.forEach(function(g){ g.forEach(function(id){order.push(id);}); });
  var n=order.length; if(!n) return '';
  var W=760,C=380,R=275,pos={};
  order.forEach(function(id,i){ var t=-Math.PI/2+i*2*Math.PI/n; pos[id]={x:C+R*Math.cos(t),y:C+R*Math.sin(t),t:t}; });
  var lines='';
  for(var i=0;i<n;i++) for(var j=i+1;j<n;j++){
    var a=order[i],b=order[j],p=A.pairs[a+'|'+b]; if(!p) continue;
    if(p==='r'&&T.socX===false) continue; if(p==='y'&&!T.socY) continue;
    var col=p==='g'?'#3d9a6a':p==='r'?'#c2513f':'#e0b23c', w=p==='g'?2.2:1.8;
    var mx=(pos[a].x+pos[b].x)/2, my=(pos[a].y+pos[b].y)/2, qx=C+(mx-C)*0.35, qy=C+(my-C)*0.35;
    lines+='<path d="M'+pos[a].x.toFixed(1)+' '+pos[a].y.toFixed(1)+' Q'+qx.toFixed(1)+' '+qy.toFixed(1)+' '+pos[b].x.toFixed(1)+' '+pos[b].y.toFixed(1)+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-opacity="'+(p==='g'?0.8:0.75)+'"'+(p==='y'?' stroke-dasharray="5 4"':'')+'/>';
  }
  var nodes='';
  order.forEach(function(id){ var P=pos[id], k=G.gOf[id], resp=!!A.resp[id];
    var fill=k!=null?GCOL[k%GCOL.length]:(resp?'#b9bcc2':'#fff');
    var lx=C+(R+16)*Math.cos(P.t), ly=C+(R+16)*Math.sin(P.t), anc=Math.cos(P.t)>0.2?'start':Math.cos(P.t)<-0.2?'end':'middle';
    nodes+='<circle cx="'+P.x.toFixed(1)+'" cy="'+P.y.toFixed(1)+'" r="8" fill="'+fill+'" stroke="'+(resp?'#fff':'#9aa0a8')+'" stroke-width="2"'+(resp?'':' stroke-dasharray="2 2"')+'/>'+
      '<text x="'+lx.toFixed(1)+'" y="'+(ly+4).toFixed(1)+'" text-anchor="'+anc+'" font-size="13" fill="'+(resp?'#24272c':'#9aa0a8')+'">'+esc(A.st[id].s.name)+'</text>';
  });
  return '<svg class="soc" viewBox="0 0 '+W+' '+W+'" xmlns="http://www.w3.org/2000/svg">'+lines+nodes+'</svg>';
}

      rows.map(function(r){ return '<tr><td><a href="#" data-pick="'+r.s.id+'">'+esc(r.s.name)+'</a>'+(r.responded?'':' <span class="sub">미제출</span>')+'</td>'+['rO','rX','like','mutualO','pc'].map(function(c){ var val=r[c]; if(c==='mutualO'&&!r.responded) val='-'; return '<td class="num">'+val+'</td>'; }).join('')+'</tr>'; }).join('')+'</table>';

function statTable(A){
  var rows=A.studs.map(function(s){ return A.st[s.id]; });

function vCompare(v){

  var ids=T.rounds.map(function(r){return r.id;});
  if(!T.cmpB||ids.indexOf(T.cmpB)<0) T.cmpB=T.rid;
  if(!T.cmpA||ids.indexOf(T.cmpA)<0||T.cmpA===T.cmpB){ var bi=ids.indexOf(T.cmpB); T.cmpA=ids[bi>0?bi-1:1]; }
  var need=[T.cmpA,T.cmpB].filter(function(id){return !T.data[id];});

  function dl(a,b){ if(a==null||b==null||a==='-'||b==='-') return '<span class="same">-</span>'; var d=b-a; return d>0?'<span class="up">+'+d+'</span>':d<0?'<span class="down">'+d+'</span>':'<span class="same">0</span>'; }
  var h='<div class="card noprint">'+sel('ca',T.cmpA)+' 와(과) '+sel('cb',T.cmpB)+' 비교 <button class="btn sm" onclick="window.print()">인쇄</button>'+
    '<div class="sub" style="margin-top:6px">'+esc(ra.name)+' 제출 '+A.n+'명, '+esc(rb.name)+' 제출 '+B.n+'명. 제출 인원이 다르면 숫자 차이가 날 수 있어요.</div></div>';
  h+='<div class="card"><h2>학생별 변화 <span class="sub">앞 숫자 → 뒤 숫자 (차이)</span></h2><div style="overflow:auto"><table class="tbl"><tr><th>번호</th><th>이름</th><th class="num">받은 ○</th><th class="num">받은 X</th><th class="num">호감도</th><th class="num">관심도</th><th class="num">긍정성</th><th class="num">부정성</th><th class="num">서로 ○</th></tr>';
  B.studs.forEach(function(s){ var a=A.st[s.id], b=B.st[s.id];
    function c(k,needResp){ var av=a?(needResp&&!a.responded?'-':a[k]):'-', bv=(needResp&&!b.responded)?'-':b[k]; return '<td class="num">'+av+' → '+bv+' ('+dl(av,bv)+')</td>'; }
    h+='<tr><td>'+s.no+'</td><td>'+esc(s.name)+(a?'':' <span class="sub">(새 학생)</span>')+'</td>'+c('rO')+c('rX')+c('like')+c('interest')+c('gO',1)+c('gX',1)+c('mutualO',1)+'</tr>';
  });
  h+='</table></div></div>';
  // 짝 관계 변화
  var nameOf={}; T.roster.forEach(function(s){nameOf[s.id]=s.name;});
  var buckets={newG:[],lostG:[],newR:[],lostR:[]};
  var S=B.studs;
  for(var i=0;i<S.length;i++) for(var j=i+1;j<S.length;j++){
    var k=S[i].id+'|'+S[j].id; if(!(k in A.pairs)||!(k in B.pairs)) continue;
    var pa=A.pairs[k], pb=B.pairs[k], label=nameOf[S[i].id]+' · '+nameOf[S[j].id];
    if(pb==='g'&&pa!=='g') buckets.newG.push(label); if(pa==='g'&&pb!=='g') buckets.lostG.push(label);
    if(pb==='r'&&pa!=='r') buckets.newR.push(label); if(pa==='r'&&pb!=='r') buckets.lostR.push(label);
  }
  function box(t,arr,cls){ return '<div class="card"><h2>'+t+' ('+arr.length+')</h2>'+(arr.length?'<div class="names">'+arr.map(function(x){return '<span class="'+cls+'">'+esc(x)+'</span>';}).join('')+'</div>':'<span class="sub">없음</span>')+'</div>'; }
  h+='<div class="sub" style="margin:0 0 8px">두 회차 모두 낸 학생끼리만 비교해요.</div><div class="two">'+box('새로 서로 ○가 된 짝',buckets.newG,'m')+box('서로 ○가 깨진 짝',buckets.lostG,'')+box('새로 서로 X가 된 짝',buckets.newR,'x')+box('서로 X가 풀린 짝',buckets.lostR,'o')+'</div>';
  h+='<div class="two">'+[[ra,A],[rb,B]].map(function(x){ var G=groupsOf(x[1]);
    return '<div class="card"><h2>'+esc(x[0].name)+' 친구 그룹</h2>'+G.parts.filter(function(g){return g.length>=2;}).map(function(g){ return '<div class="names" style="margin:5px 0">'+g.map(function(id){return '<span class="o">'+esc(nameOf[id])+'</span>';}).join('')+'</div>'; }).join('')+
      (G.alone.length?'<div class="sub" style="margin-top:6px">서로 ○ 친구 없음: '+G.alone.map(function(id){return esc(nameOf[id]);}).join(', ')+'</div>':'')+'</div>'; }).join('')+'</div>';
  // 마음이 바뀐 표시
  var flips=[];
  S.forEach(function(a){ var x=A.resp[a.id], y=B.resp[a.id]; if(!x||!y) return;
    S.forEach(function(b){ if(a.id===b.id) return; var p=x.rel[b.id], q=y.rel[b.id];
      if((p==='o'&&q==='x')||(p==='x'&&q==='o')) flips.push({a:a.name,b:b.name,p:p,q:q}); }); });

  v.innerHTML=h;
  document.getElementById('ca').onchange=function(){ T.cmpA=this.value; draw(); };
  document.getElementById('cb').onchange=function(){ T.cmpB=this.value; draw(); };
}

    (IS_GAS?'<div class="card"><h2>연결된 시트</h2><div class="sub">이 기기는 지금 연결된 시트로 열려요. 다른 반 시트를 쓰려면 연결을 끊고 새 주소를 넣으세요.</div><div class="set-row"><button class="btn" id="unl">연결 끊기</button><span class="sub">화면 버전 '+APP_VER+'</span></div></div>':'')+
    '<div class="card"><h2>선생님 비밀번호 바꾸기</h2><div class="set-row"><input type="password" id="op" placeholder="지금 비밀번호"><input type="password" id="np" placeholder="새 비밀번호(4자 이상)"><button class="btn" id="cp">바꾸기</button></div></div>';
  function collectQ(){ return [].map.call(v.querySelectorAll('#qbox input'),function(x){return x.value;}); }

      praiseRequired:chk('pReq'), praiseQuestion:val('pQ'), conflictMax:num('cMax'), conflictQuestion:val('cQ'), askTeacherMessage:chk('tMsg') };

    call('updateRound',T.token,T.rid,{name:val('rname'),settings:ns}).then(function(x){ T.rounds=x; draw(); toast('저장했어요'); }).catch(fail);
  };

    modal('<h2>'+esc(r.name)+' 지우기</h2><div class="sub">이 회차와 학생 응답이 모두 지워지고 되돌릴 수 없어요. 확인하려면 회차 이름을 그대로 적어 주세요.</div><input id="cf" style="width:100%;margin-top:10px">',

        call('deleteRound',T.token,T.rid).then(function(x){ T.rounds=x; delete T.data[r.id]; T.rid=x.length?x[x.length-1].id:null; return loadRound(T.rid); }).then(draw).catch(fail); },'warn']]);
  };
  var unl=document.getElementById('unl'); if(unl) unl.onclick=function(){ lsSet(KEY_NAME,null); T.token=null; connectView(); };
  document.getElementById('cp').onclick=function(){ call('changePassword',T.token,val('op'),val('np')).then(function(){ T.defaultPw=false; toast('비밀번호를 바꿨어요'); draw(); }).catch(fail); };
  function val(id){ return document.getElementById(id).value; } function chk(id){ return document.getElementById(id).checked; } function num(id){ return Math.max(0,parseInt(val(id),10)||0); }
}

/* 학생 명단·코드 (점퍼스 학생 등록 방식: 붙여넣으면 바로 미리보기 → 확인 후 등록) */
function parseBulk(raw){
  var out=[];
  raw.split('\n').forEach(function(line){
    var t=line.replace(/\r/g,''); if(!t.trim()) return;
    var p=t.split('\t'); if(p.length<2) p=t.split(','); if(p.length<2) p=t.trim().split(/\s+/);
    p=p.map(function(x){return x.trim();});
    if(/^번호$|^no$/i.test(p[0])||/^이름$/.test(p[0])) return;            // 제목 줄
    var no='',name='',g='';
    if(/^\d+\s*번?$/.test(p[0])){ no=p[0].replace(/\D/g,''); name=p[1]||''; g=p[2]||''; } else { name=p[0]; g=p[1]||''; }
    g=/남/.test(g)?'남':/여/.test(g)?'여':'';
    var row={no:no,name:name,gender:g,ok:true,why:''};
    if(!name){ row.ok=false; row.why='이름이 없어요'; }
    else if(T.roster.some(function(s){ return s.name===name && String(s.no)===String(no||s.no); })){ row.ok=false; row.why='이미 등록됨'; }
    else if(no && T.roster.some(function(s){ return String(s.no)===no && s.status!=='전출'; })){ row.ok=false; row.why=no+'번이 이미 있어요'; }
    else if(out.some(function(o){ return o.ok && o.name===name && o.no===no; })){ row.ok=false; row.why='붙여 넣은 내용 안에서 중복'; }
    out.push(row);
  });
  return out;
}

      '<p class="sub">이름·성별·상태를 고친 뒤 [바뀐 내용 저장]을 눌러 주세요. 전학 간 학생은 상태를 "전출"로 바꾸면 설문과 표에서 빠져요. 코드를 잃어버린 학생만 [새 코드]로 바꿔 주세요.</p>'+

      R.map(function(s){ return '<tr data-id="'+esc(s.id)+'"'+(s.status==='전출'?' style="opacity:.55"':'')+'><td><input class="no" value="'+esc(s.no)+'" style="width:52px"></td><td><input class="nm" value="'+esc(s.name)+'" style="width:100%"></td>'+

  /* 붙여 넣기 미리보기 */
  var bulk=document.getElementById('bulk'), parsed=[];
